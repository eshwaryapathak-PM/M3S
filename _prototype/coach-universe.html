<!--
  ═════════════════════════════════════════════════════════════════════════════
  My Third Space — COACH UNIVERSE — Source Bundle
  ═════════════════════════════════════════════════════════════════════════════

  Coach-facing dashboard: login, calendar (day/week/month), PT invite triage,
  peer calendars, profile editor, Google Calendar sync, mobile coach view,
  admin views, and a client profile drilldown.

  Single-file dump of the complete source tree for reading + porting (e.g. to
  Next.js + TypeScript). Every dependency is inlined as plain source. Asset
  references (assets/*.jpg) remain as relative URLs.

  ENTRY ORDER (top → bottom):
    1.  tokens.css                       — design tokens
    2.  <style> from coach-universe.html — page-level CSS (.mono, .serif, …)
    3.  React + ReactDOM + Babel         — CDN
    4.  data.js                          — all mock data
    5.  client-profile.jsx               — client/member drilldown view
    6.  admin-triage.jsx                 — admin triage queues
    7.  admin.jsx                        — admin dashboard
    8.  fitness-score.jsx                — score widget (shared with client app)
    9.  coach-mobile.jsx                 — mobile coach view
    10. coach-universe.jsx               — main desktop coach dashboard (entry)
  ═════════════════════════════════════════════════════════════════════════════
-->

/* ============================================================================
 * SOURCE: tokens.css

/* My Third Space — Design Tokens */
:root {
  /* Warm earth palette */
  --sand-50:  #FBF7F0;  /* page bg */
  --sand-100: #F5EDE0;  /* card bg */
  --sand-200: #EADBC4;  /* subtle surface */
  --sand-300: #D9C3A3;
  --sand-400: #C3A781;

  --clay-500: #A8825A;  /* mid brown */
  --clay-600: #8A6640;
  --walnut-700: #5E4228; /* primary brown */
  --espresso-800: #3E2C1C;
  --espresso-900: #241810;

  /* Accents — earthy complementaries */
  --sage-500: #7B8B6F;   /* muted green */
  --sage-200: #D7DECF;
  --terracotta-500: #B86B4B; /* warm clay */
  --terracotta-200: #ECCDBF;
  --ochre-500: #C99A3F;
  --ink: #1C140E;
  --paper: #FFFDF8;
  --hairline: rgba(62,44,28,0.12);
  --hairline-strong: rgba(62,44,28,0.22);

  /* Type */
  --f-display: "Instrument Serif", "Cormorant Garamond", Georgia, serif;
  --f-body: "Inter", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, monospace;

  /* Spacing (4pt) */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px;
  --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px; --s-16: 64px; --s-20: 80px;

  /* Radii */
  --r-sm: 6px; --r-md: 10px; --r-lg: 16px; --r-xl: 24px; --r-pill: 999px;

  /* Shadows — soft */
  --sh-1: 0 1px 2px rgba(62,44,28,0.06);
  --sh-2: 0 6px 20px -8px rgba(62,44,28,0.18);
  --sh-3: 0 20px 50px -20px rgba(62,44,28,0.35);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--f-body);
  color: var(--ink);
  background: var(--sand-50);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

img, video { max-width: 100%; height: auto; }

/* ---------- Responsive global rules ---------- */

/* Prevent horizontal bleed without creating a scroll container (clip preserves sticky) */

/* ---------- Services: desktop/mobile swap ---------- */
@keyframes svcFade { from { opacity: 0 } to { opacity: 1 } }

.m3s-services .svc-mobile { display: none; }

<style data-filename="coach-universe.html (inline)">
/* ============================================================================
 * SOURCE: coach-universe.html — inline <style>
 * ============================================================================ */

  html { scroll-behavior: smooth; }
  body { background: var(--sand-50); color: var(--ink); font-family: var(--f-body); }
  ::selection { background: var(--walnut-700); color: var(--paper); }

  .mono { font-family: var(--f-mono); letter-spacing: 1.8px; text-transform: uppercase; font-size: 11px; }
  .serif { font-family: var(--f-display); font-weight: 400; letter-spacing: -0.01em; }

  /* Subtle grid paper bg on workspace */
  .paper-grid {
    background-image:
      linear-gradient(var(--hairline) 1px, transparent 1px),
      linear-gradient(90deg, var(--hairline) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: -1px -1px;
  }

  /* Calendar scrollable inner region */
  .cal-scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--sand-300) transparent; }
  .cal-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .cal-scroll::-webkit-scrollbar-thumb { background: var(--sand-300); border-radius: 4px; }
  .cal-scroll::-webkit-scrollbar-track { background: transparent; }

  /* Form inputs */
  .m3s-input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid var(--hairline-strong);
    border-radius: var(--r-md);
    font-family: var(--f-body);
    font-size: 15px;
    background: var(--paper);
    color: var(--ink);
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .m3s-input:focus { border-color: var(--walnut-700); box-shadow: 0 0 0 3px rgba(94,66,40,0.12); }
  .m3s-input::placeholder { color: var(--clay-600); opacity: 0.7; }

  .btn-primary {
    background: var(--walnut-700); color: var(--paper);
    border: none; padding: 14px 22px; border-radius: var(--r-pill);
    font-family: var(--f-body); font-size: 14px; font-weight: 500;
    cursor: pointer; transition: background .2s, transform .1s;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn-primary:hover { background: var(--espresso-800); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-ghost {
    background: transparent; color: var(--walnut-700);
    border: 1px solid var(--hairline-strong); padding: 10px 16px; border-radius: var(--r-pill);
    font-size: 13px; cursor: pointer; transition: background .2s;
    font-family: var(--f-body);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-ghost:hover { background: var(--sand-100); }

  .btn-icon {
    width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center;
    background: var(--paper); border: 1px solid var(--hairline-strong); border-radius: 50%;
    cursor: pointer; color: var(--walnut-700); transition: background .2s;
  }
  .btn-icon:hover { background: var(--sand-100); }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: var(--r-pill);
    background: var(--sand-100); font-size: 11px; color: var(--walnut-700);
    font-family: var(--f-mono); letter-spacing: 1.2px; text-transform: uppercase;
    border: 1px solid var(--hairline);
  }
  .chip-dot { width: 6px; height: 6px; border-radius: 50%; }

  /* Event block base */
  .evt {
    position: absolute; left: 4px; right: 4px;
    padding: 6px 8px; border-radius: 8px;
    font-size: 12px; line-height: 1.25;
    cursor: pointer; overflow: hidden;
    border: 1px solid transparent;
    transition: transform .15s, box-shadow .15s;
  }
  .evt:hover { transform: translateY(-1px); box-shadow: var(--sh-2); z-index: 5; }
  .evt.pt     { background: #EFE2D3; border-color: #D9C3A3; color: #4A3420; }
  .evt.group  { background: #DEE5D3; border-color: #B8C4A5; color: #3E4A32; }
  .evt.block  { background: #ECCDBF; border-color: #D9A890; color: #5A3020; }
  .evt.open   { background: #FFFDF8; border: 1px dashed var(--hairline-strong); color: var(--clay-600); }
  .evt.pending{ background: #FFF2D8; border-color: #E8C77A; color: #6A4A10; }

  .hour-line { border-top: 1px solid var(--hairline); }
  .hour-label { font-family: var(--f-mono); font-size: 10px; letter-spacing: 1px; color: var(--clay-600); text-transform: uppercase; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--espresso-900); color: var(--sand-100);
    padding: 14px 22px; border-radius: var(--r-pill);
    font-size: 14px; box-shadow: var(--sh-3); z-index: 100;
    display: inline-flex; align-items: center; gap: 10px;
    animation: toastIn .3s ease-out;
  }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 20px);} to { opacity: 1; transform: translate(-50%, 0);} }
  @keyframes sheetUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  /* Modal */
  .m3s-modal-backdrop {
    position: fixed; inset: 0; background: rgba(36,24,16,0.5);
    backdrop-filter: blur(4px); z-index: 50;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; animation: fadeIn .2s;
  }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  .m3s-modal {
    background: var(--paper); border-radius: var(--r-xl);
    max-width: 480px; width: 100%; padding: 32px;
    box-shadow: var(--sh-3); animation: modalIn .25s ease-out;
  }
  @keyframes modalIn { from { opacity: 0; transform: scale(0.96) translateY(8px);} to { opacity: 1; transform: scale(1) translateY(0);} }

  /* Mobile-notice gate is now handled by the React MobileShell.
     Legacy classes left as no-ops so older snapshots still render OK. */
  .mobile-notice { display: none; }
  .desktop-only { /* no-op */ }

  /* Hide scrollbars on tab pills */
  .tab-row::-webkit-scrollbar { display: none; }

</style>

function generateSlots() {
  const days = [];
  const today = new Date(2026, 3, 17); // Apr 17 2026
  const times = ["06:30", "07:30", "09:00", "10:30", "17:00", "18:30", "19:30"];
  for (let i = 0; i < 70; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    const slots = [];
    times.forEach((t) => {
      // vary availability pseudo-deterministically
      // Only PT-eligible coaches are offered in the booking grid
      window.PT_TRAINERS.forEach((tr) => {
        const seed = (i * 31 + t.charCodeAt(0) + tr.id.charCodeAt(0)) % 10;
        if (seed > 3) slots.push({ time: t, trainerId: tr.id });
      });
    });
    days.push({
      date: d,
      iso: d.toISOString().slice(0, 10),
      label: d.toLocaleDateString("en-US", { weekday: "short" }),
      day: d.getDate(),
      month: d.toLocaleDateString("en-US", { month: "short" }),
      slots,
    });
  }
  return days;
}

    if (p.injuries && p.injuries.length) base.injuries.fields[1].value = p.injuries.join(" · ");
    if (p.notes)       base.lifestyle.fields = [
      ...base.lifestyle.fields,
      { label: "Coach notes", value: p.notes },
    ];
    if (p.coachId)     base.coach.fields[0].value = p.coachId;
    return base;
  }, [profileData]);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12, maxWidth: 880 }}>
      {/* M3S Fitness Score — coach-editable. Changes here surface on the client's profile. */}
      <FitnessScoreSection profile={profileData || {}} coachEditable />

      {ASSESSMENT_ORDER.map(s => {
        const data = assessment[s.id];
        const isOpen = open[s.id];
        return (
          <div key={s.id} style={{
            background: "var(--paper)", borderRadius: "var(--r-lg)",

              <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
                <span className="mono" style={{ color: "var(--clay-600)" }}>{s.eyebrow}</span>
                <span style={{ fontFamily: "var(--f-display)", fontSize: 22, fontStyle: "italic", color: "var(--espresso-900)" }}>

              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>

              </div>
            </button>

            {isOpen && (
              <div style={{ padding: "0 22px 18px", borderTop: "1px solid var(--hairline)" }}>
                {data.fields.map((f, i) => (
                  <OverrideField key={i} field={f} sectionId={s.id} readOnly={readOnly} />
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ------- Tiny SVG line chart -------
function ProgressChart({ data }) {
  const W = 760, H = 240, pad = { l: 50, r: 24, t: 24, b: 36 };
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;

  const fatVals = data.map(d => d.fatPct);
  const muscleVals = data.map(d => d.muscle);
  const all = [...fatVals, ...muscleVals];
  const min = Math.floor(Math.min(...all) - 2);
  const max = Math.ceil(Math.max(...all) + 2);

  const x = i => pad.l + (i / (data.length - 1)) * innerW;
  const y = v => pad.t + (1 - (v - min) / (max - min)) * innerH;

  const line = vals => vals.map((v, i) => `${i ? "L" : "M"} ${x(i)} ${y(v)}`).join(" ");

  const lastFat = data[data.length - 1].fatPct;
  const firstFat = data[0].fatPct;
  const lastMuscle = data[data.length - 1].muscle;
  const firstMuscle = data[0].muscle;

  return (
    <div style={{
      background: "var(--paper)", borderRadius: "var(--r-lg)",
      border: "1px solid var(--hairline-strong)", padding: 24, boxShadow: "var(--sh-2)",
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "end", marginBottom: 16, flexWrap: "wrap", gap: 12 }}>
        <div>
          <div className="mono" style={{ color: "var(--clay-600)", marginBottom: 6 }}>— Body composition · 5 months</div>
          <div style={{ fontFamily: "var(--f-display)", fontSize: 28, fontStyle: "italic", color: "var(--espresso-900)" }}>
            Steady, controlled trend
          </div>
        </div>
        <div style={{ display: "flex", gap: 20 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ width: 18, height: 2, background: "var(--walnut-700)" }} />
            <span className="mono" style={{ color: "var(--walnut-700)" }}>Fat %</span>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ width: 18, height: 2, background: "var(--ochre-500)" }} />
            <span className="mono" style={{ color: "var(--clay-600)" }}>Muscle (kg)</span>
          </div>
        </div>
      </div>

      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }}>
        {/* Date labels */}
        {data.map((d, i) => (
          <text key={i} x={x(i)} y={H - 14} textAnchor="middle"
            fontFamily="var(--f-mono)" fontSize="10" fill="#8A6640" letterSpacing="1.2">
            {d.date.toUpperCase()}
          </text>
        ))}

        {/* Fat line */}
        <path d={line(fatVals)} fill="none" stroke="#5E4228" strokeWidth="2" />
        {fatVals.map((v, i) => (
          <circle key={"f"+i} cx={x(i)} cy={y(v)} r="4" fill="#FFFDF8" stroke="#5E4228" strokeWidth="2" />
        ))}

        {/* Muscle line */}
        <path d={line(muscleVals)} fill="none" stroke="#C99A3F" strokeWidth="2" />
        {muscleVals.map((v, i) => (
          <circle key={"m"+i} cx={x(i)} cy={y(v)} r="4" fill="#FFFDF8" stroke="#C99A3F" strokeWidth="2" />
        ))}

        {/* End-point value labels */}
        <text x={x(fatVals.length-1) + 10} y={y(lastFat) + 4}
          fontFamily="var(--f-mono)" fontSize="11" fill="#5E4228" fontWeight="600">
          {lastFat}%
        </text>
        <text x={x(muscleVals.length-1) + 10} y={y(lastMuscle) + 4}
          fontFamily="var(--f-mono)" fontSize="11" fill="#C99A3F" fontWeight="600">
          {lastMuscle}kg
        </text>
      </svg>

      {/* Stat chips */}
      <div style={{ display: "flex", gap: 12, marginTop: 16, flexWrap: "wrap", paddingTop: 16, borderTop: "1px solid var(--hairline)" }}>
        <StatChip label="Fat % delta" value={`${(lastFat - firstFat).toFixed(1)} pts`} dir="down" />
        <StatChip label="Muscle delta" value={`+${(lastMuscle - firstMuscle).toFixed(1)} kg`} dir="up" />
        <StatChip label="Sessions" value="8 of 16" dir="flat" />
        <StatChip label="Adherence" value="94%" dir="up" />
      </div>
    </div>
  );
}

function StatChip({ label, value, dir }) {
  const tone = dir === "up" ? { bg: "var(--sage-200)", fg: "var(--sage-500)" }
            : dir === "down" ? { bg: "var(--sage-200)", fg: "var(--sage-500)" }
            : { bg: "var(--sand-200)", fg: "var(--clay-600)" };
  return (
    <div style={{
      padding: "10px 14px", borderRadius: "var(--r-md)",
      background: "var(--sand-50)", border: "1px solid var(--hairline)",
      display: "flex", flexDirection: "column", gap: 4, minWidth: 120,

      <span className="mono" style={{ color: "var(--clay-600)" }}>{label}</span>
      <span style={{ fontFamily: "var(--f-display)", fontSize: 22, fontStyle: "italic", color: "var(--espresso-900)" }}>{value}</span>
    </div>
  );
}

function NotesTab({ client }) {
  const clientId = clientIdFor(client);

  // Notes feed: prefer localStorage; fall back to seed for first-time view.
  const [notes, setNotes] = cpUseState(() => {
    const stored = loadSessionNotes(clientId);
    return stored.length > 0 ? stored : MEERA_NOTES_SEED;
  });
  const [adding, setAdding] = cpUseState(false);
  const [draft, setDraft] = cpUseState({ date: "APR 20, 2026", type: "PT SESSION", body: "", tags: [] });

  function toggleTag(t) {
    setDraft(d => ({ ...d, tags: d.tags.includes(t) ? d.tags.filter(x => x !== t) : [...d.tags, t] }));
  }

  function post() {
    if (!draft.body.trim()) return;
    const today = new Date().toISOString().split('T')[0]; // ISO date for sorting; UI shows draft.date for display
    const note = {
      id: clientId + "_" + Date.now(),
      clientId, coachId: COACH_ID, coachName: COACH_NAME,
      date: today,
      displayDate: draft.date,
      sessionType: draft.type,
      text: draft.body,
      tags: draft.tags,
      hasMedia: false,
    };
    saveSessionNote(note);
    // Re-load from store, but keep seed rows visible until a real one exists.
    const stored = loadSessionNotes(clientId);
    setNotes(stored.length > 0 ? stored : MEERA_NOTES_SEED);
    setDraft({ date: "APR 20, 2026", type: "PT SESSION", body: "", tags: [] });
    setAdding(false);

    <div style={{ display: "flex", flexDirection: "column", gap: 14, maxWidth: 760 }}>

            width: 32, height: 32, borderRadius: "50%",

            fontSize: 18, fontWeight: 600, flexShrink: 0,

          <span className="mono" style={{ color: "var(--walnut-700)" }}>Add session note</span>
        </button>
      ) : (
        <div style={{
          background: "var(--paper)", borderRadius: "var(--r-lg)",
          border: "1px solid var(--ochre-500)", padding: 24, boxShadow: "var(--sh-2)",
        }}>
          <div className="mono" style={{ color: "var(--clay-600)", marginBottom: 14 }}>— New session note</div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 2fr", gap: 12, marginBottom: 14 }}>
            <input value={draft.date} onChange={e => setDraft({ ...draft, date: e.target.value })}
              className="mono" style={{
              padding: "10px 14px", borderRadius: "var(--r-md)",
              background: "var(--sand-50)", border: "1px solid var(--hairline-strong)",
              fontFamily: "var(--f-mono)", fontSize: 11, letterSpacing: 1.5, color: "var(--espresso-900)",
              outline: "none", textTransform: "uppercase",

            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>

                    padding: "6px 14px", borderRadius: "var(--r-pill)",

        const type = n.sessionType || n.type || 'PT SESSION';
        const displayDate = n.displayDate || (n.date && n.date.match(/^\d{4}-\d{2}-\d{2}$/)
          ? (() => {
              const [y, m, d] = n.date.split('-');
              const month = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][parseInt(m,10)-1];
              return `${month} ${parseInt(d,10)}, ${y}`;
            })()
          : n.date);
        const tags = n.tags || [];
        const media = typeof n.media === 'number' ? n.media : 0;
        const fromCoach = n.coachName ? ` · ${n.coachName}` : '';
        return (

            fontSize: 16, lineHeight: 1.55, color: "var(--espresso-900)", margin: "0 0 14px",

                }}>◱ MEDIA</div>
              ))}
            </div>
          )}
        </div>
        );
      })}
    </div>
  );
}

function NutritionCoachTab({ client }) {

  const [entries, setEntries] = cpUseState(() => loadNutritionForClient(clientId));
  const [showForm, setShowForm] = cpUseState(false);
  const [form, setForm] = cpUseState({
    calories: '', protein: '', carbs: '', fat: '', notes: '', tags: '', period: '',
  });

  const current = entries[0];

  function openEdit() {
    if (current) {
      setForm({
        calories: String(current.mealPlan?.calories ?? ''),
        protein:  String(current.mealPlan?.protein  ?? ''),
        carbs:    String(current.mealPlan?.carbs    ?? ''),
        fat:      String(current.mealPlan?.fat      ?? ''),
        notes:    current.notes || '',
        tags:     (current.tags || []).join(', '),
        period:   current.period || '',
      });

    setShowForm(true);
  }

    const entry = {
      id: clientId + '_' + Date.now(),
      clientId, coachId: COACH_ID, coachName: COACH_NAME,

        calories: parseInt(form.calories) || 0,

        carbs:    parseInt(form.carbs)    || 0,
        fat:      parseInt(form.fat)      || 0,
      },
      notes: form.notes,
      tags: form.tags.split(',').map(t => t.trim()).filter(Boolean),
    };
    saveNutritionEntry(entry);
    setEntries(loadNutritionForClient(clientId));
    setShowForm(false);
    setForm({ calories: '', protein: '', carbs: '', fat: '', notes: '', tags: '', period: '' });

  const macroValue = {
    fontFamily: "var(--f-display)", fontStyle: "italic", fontSize: 26,

  const inputStyle = {
    width: "100%", padding: "10px 12px", borderRadius: "var(--r-md)",

            — Client · {client.programme}
          </div>
          <h2 className="serif" style={{ fontSize: 44, margin: 0, color: "var(--espresso-900)", fontStyle: "italic" }}>
            {(profileData && profileData.name) || client.name}
          </h2>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <span className="mono" style={{
            display: "inline-flex", alignItems: "center", gap: 6,
            background: sourceMeta.bg, color: sourceMeta.fg,
            padding: "6px 12px", borderRadius: "var(--r-pill)",
            border: "1px solid var(--hairline)", fontWeight: 600,
          }}>
            <span style={{ width: 6, height: 6, borderRadius: "50%", background: sourceMeta.dot }} />
            {sourceMeta.label}
          </span>
          <span className="mono" style={{
            background: "var(--sand-100)", color: "var(--walnut-700)",
            padding: "8px 14px", borderRadius: "var(--r-pill)",

      <CPTabs tab={tab} setTab={setTab} />

      {tab === "assessment" && <AssessmentTab profileData={profileData} readOnly={readOnly} />}

      {tab === "nutrition"  && <NutritionCoachTab client={client} />}
    </div>
  );
}

window.ClientProfile = ClientProfile;

                    color: duration === d ? "var(--paper)" : "var(--walnut-700)",
                    cursor: "pointer", fontSize: 13, fontFamily: "var(--f-body)",
                  }}>{d} min</button>
                ))}
              </div>
              <label className="mono" style={{ display: "block", color: "var(--clay-600)", marginBottom: 8 }}>Allocation note</label>
              <input className="m3s-input" value={note} onChange={e => setNote(e.target.value)} placeholder="Optional note for the coach" />
            </>
          )}

          {type === "GROUP" && (
            <>
              <label className="mono" style={{ display: "block", color: "var(--clay-600)", marginBottom: 8 }}>Class name</label>
              <input className="m3s-input" placeholder="e.g. Saturday Strong" style={{ marginBottom: 16 }} />
              <label className="mono" style={{ display: "block", color: "var(--clay-600)", marginBottom: 8 }}>Capacity</label>
              <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 16 }}>
                <button className="btn-icon">–</button>
                <span style={{ fontFamily: "var(--f-display)", fontSize: 28, color: "var(--espresso-900)" }}>12</span>
                <button className="btn-icon">+</button>
              </div>
            </>
          )}

          {type === "BLOCK" && (
            <>
              <label className="mono" style={{ display: "block", color: "var(--clay-600)", marginBottom: 8 }}>Reason</label>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 16 }}>
                {["personal","programming","travel","studio event"].map(r => {
                  const active = reason === r;
                  return (
                    <button key={r} onClick={() => setReason(r)} className="mono" style={{
                      padding: "7px 12px", borderRadius: 999,
                      border: "1px solid " + (active ? "var(--walnut-700)" : "var(--hairline-strong)"),
                      background: active ? "var(--walnut-700)" : "var(--paper)",
                      color: active ? "var(--paper)" : "var(--walnut-700)",
                      cursor: "pointer", fontSize: 10,
                    }}>{r}</button>
                  );
                })}
              </div>
              <label className="mono" style={{ display: "block", color: "var(--clay-600)", marginBottom: 8 }}>Recurrence</label>
              <div style={{ display: "flex", gap: 6 }}>
                {["one-off","weekly","custom"].map(r => (
                  <button key={r} className="mono" style={{
                    padding: "7px 12px", borderRadius: 999, border: "1px solid var(--hairline-strong)",
                    background: "var(--paper)", color: "var(--walnut-700)", cursor: "pointer", fontSize: 10,
                  }}>{r}</button>
                ))}
              </div>
            </>
          )}
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, padding: "0 24px 24px" }}>
          <button className="btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn-primary" onClick={onSave} style={{ background: "var(--terracotta-500)" }}>Allocate →</button>
        </div>
      </div>
    </div>
  );
}

function AdminInvitesTab({ invites, setInvites, toast, openTriage }) {
  const TRAINERS = window.TRAINERS || [];
  const coachById = (id) => TRAINERS.find(t => t.id === id);

  const extras = [
    { id: "adm-inv-00", member: "Riya Sharma", memberInitials: "RS", coachId: "joe", day: "Tue, Apr 29", time: "07:00", duration: 60, submitted: "Today, 9:14 AM", status: "rejected", reason: "Pre-existing PT runs to 6:45 — no buffer to reset for a 7 AM." },
    { id: "adm-inv-01", member: "Rohan T.",  memberInitials: "RT", coachId: "deepika", day: "Wed, Apr 23", time: "06:00", duration: 60, submitted: "3 days ago", status: "pending" },
    { id: "adm-inv-02", member: "Vikram R.", memberInitials: "VR", coachId: "joe",     day: "Fri, Apr 25", time: "07:00", duration: 60, submitted: "1 day ago",  status: "pending" },
    { id: "adm-inv-03", member: "Priya K.",  memberInitials: "PK", coachId: "rahul",   day: "Mon, Apr 28", time: "06:30", duration: 60, submitted: "5 days ago", status: "overdue" },
  ];

  // Combine SEED + extras, mapping to coach
  const baseCoachMap = { "inv-01": "joe", "inv-02": "rahul", "inv-03": "lee" };
  const combined = [
    ...invites.map(i => ({ ...i, coachId: baseCoachMap[i.id] || "joe", submitted: i.requestedAt })),
    ...extras,
  ];

  const [selected, setSelected] = useStateAdm({});
  const [filter, setFilter] = useStateAdm("ALL");
  const [coachFilter, setCoachFilter] = useStateAdm("ALL");
  const [reassign, setReassign] = useStateAdm(null);

  const filterMatch = (i) => {
    if (filter === "ALL") return true;
    if (filter === "PENDING") return i.status === "pending";
    if (filter === "ACCEPTED") return i.status === "accepted";
    if (filter === "REJECTED") return i.status === "rejected";
    if (filter === "OVERDUE") return i.status === "overdue";
    return true;
  };
  const filtered = combined.filter(i => filterMatch(i) && (coachFilter === "ALL" || i.coachId === coachFilter));

  const selectedCount = Object.values(selected).filter(Boolean).length;

  function toggleAll() {
    if (selectedCount === filtered.length) { setSelected({}); return; }
    const next = {};
    filtered.forEach(i => next[i.id] = true);
    setSelected(next);
  }
  function bulk(action) {
    if (selectedCount === 0) return;
    toast(`${action} ${selectedCount} invite${selectedCount === 1 ? "" : "s"}`);
    setSelected({});
  }

  const statusChip = (s) => {
    const map = {
      pending:  { bg: "#FFF2D8",                 fg: "#6A4A10",                 lbl: "Pending" },
      accepted: { bg: "var(--sage-200)",         fg: "var(--sage-500)",         lbl: "Accepted" },
      rejected: { bg: "var(--terracotta-200)",   fg: "var(--terracotta-500)",   lbl: "Rejected" },
      overdue:  { bg: "var(--terracotta-500)",   fg: "var(--paper)",            lbl: "Overdue" },
      "alternate-sent": { bg: "#FFF2D8", fg: "#6A4A10", lbl: "Alt sent" },
    };
    const m = map[s] || map.pending;
    return <MonoChip bg={m.bg} fg={m.fg}>{m.lbl.toUpperCase()}</MonoChip>;
  };

  return (
    <div>
      <div className="mono" style={{ color: "var(--clay-600)", marginBottom: 8 }}>● ALL PT INVITES</div>
      <h2 className="serif" style={{ fontSize: 44, margin: "0 0 24px", color: "var(--espresso-900)", fontStyle: "italic" }}>
        Studio-wide invite queue.
      </h2>

      {/* Filter + bulk */}
      <div style={{
        background: "var(--paper)", borderRadius: "var(--r-lg)", boxShadow: "var(--sh-1)",
        border: "1px solid var(--hairline)", padding: "14px 20px",
        display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap", marginBottom: 20,
      }}>
        <label style={{ display: "inline-flex", alignItems: "center", gap: 8, cursor: "pointer" }}>
          <input type="checkbox" checked={selectedCount > 0 && selectedCount === filtered.length} onChange={toggleAll} />
          <span className="mono" style={{ color: "var(--clay-600)" }}>SELECT ALL</span>
        </label>
        <button onClick={() => bulk("Approved")} disabled={!selectedCount} className="mono" style={{
          padding: "6px 12px", borderRadius: "var(--r-pill)", border: "1px solid var(--sage-500)",
          background: selectedCount ? "var(--sage-200)" : "var(--sand-50)",
          color: selectedCount ? "var(--sage-500)" : "var(--clay-600)",
          cursor: selectedCount ? "pointer" : "not-allowed", fontSize: 10, opacity: selectedCount ? 1 : 0.5,
        }}>✓ APPROVE</button>
        <button onClick={() => bulk("Rejected")} disabled={!selectedCount} className="mono" style={{
          padding: "6px 12px", borderRadius: "var(--r-pill)", border: "1px solid var(--terracotta-500)",
          background: selectedCount ? "var(--terracotta-200)" : "var(--sand-50)",
          color: selectedCount ? "var(--terracotta-500)" : "var(--clay-600)",
          cursor: selectedCount ? "pointer" : "not-allowed", fontSize: 10, opacity: selectedCount ? 1 : 0.5,
        }}>✗ REJECT</button>
        <button onClick={() => bulk("Reassigned")} disabled={!selectedCount} className="mono" style={{
          padding: "6px 12px", borderRadius: "var(--r-pill)", border: "1px solid var(--ochre-500)",
          background: selectedCount ? "#FFF2D8" : "var(--sand-50)",
          color: selectedCount ? "#6A4A10" : "var(--clay-600)",
          cursor: selectedCount ? "pointer" : "not-allowed", fontSize: 10, opacity: selectedCount ? 1 : 0.5,
        }}>→ REASSIGN</button>

        <div style={{ marginLeft: "auto", display: "flex", gap: 6, flexWrap: "wrap" }}>
          {["ALL","PENDING","ACCEPTED","REJECTED","OVERDUE"].map(f => {
            const active = filter === f;
            return (
              <button key={f} onClick={() => setFilter(f)} className="mono" style={{
                padding: "6px 10px", borderRadius: "var(--r-pill)",
                border: "1px solid " + (active ? "var(--walnut-700)" : "var(--hairline-strong)"),
                background: active ? "var(--walnut-700)" : "var(--paper)",
                color: active ? "var(--paper)" : "var(--walnut-700)",
                cursor: "pointer", fontSize: 10,
              }}>{f}</button>
            );
          })}
          <select value={coachFilter} onChange={e => setCoachFilter(e.target.value)} className="mono" style={{
            padding: "6px 10px", borderRadius: "var(--r-pill)",
            border: "1px solid var(--hairline-strong)", background: "var(--paper)",
            color: "var(--walnut-700)", fontSize: 10, cursor: "pointer",
          }}>
            <option value="ALL">ALL COACHES</option>
            {TRAINERS.map(c => <option key={c.id} value={c.id}>{c.name.toUpperCase()}</option>)}
          </select>
        </div>
      </div>

      {/* Table */}
      <div style={{ background: "var(--paper)", borderRadius: "var(--r-lg)", boxShadow: "var(--sh-2)", border: "1px solid var(--hairline)", overflow: "hidden" }}>
        <div style={{
          display: "grid", gridTemplateColumns: "32px 1.2fr 1.2fr 1.2fr 0.9fr 0.9fr 1.1fr",
          padding: "12px 20px", background: "var(--sand-100)",
          borderBottom: "1px solid var(--hairline)", gap: 12, alignItems: "center",
        }}>
          <span />
          <span className="mono" style={{ color: "var(--clay-600)" }}>CLIENT</span>
          <span className="mono" style={{ color: "var(--clay-600)" }}>COACH</span>
          <span className="mono" style={{ color: "var(--clay-600)" }}>SESSION</span>
          <span className="mono" style={{ color: "var(--clay-600)" }}>SUBMITTED</span>
          <span className="mono" style={{ color: "var(--clay-600)" }}>STATUS</span>
          <span className="mono" style={{ color: "var(--clay-600)", textAlign: "right" }}>ACTIONS</span>
        </div>
        {filtered.map(i => {
          const c = coachById(i.coachId);
          return (
            <div key={i.id} style={{
              display: "grid", gridTemplateColumns: "32px 1.2fr 1.2fr 1.2fr 0.9fr 0.9fr 1.1fr",
              padding: "16px 20px", borderBottom: "1px solid var(--hairline)", gap: 12, alignItems: "center",
            }}>
              <input type="checkbox" checked={!!selected[i.id]} onChange={() => setSelected({ ...selected, [i.id]: !selected[i.id] })} />
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <div style={{
                  width: 32, height: 32, borderRadius: "50%", background: "var(--sand-200)", color: "var(--walnut-700)",
                  display: "flex", alignItems: "center", justifyContent: "center",
                  fontFamily: "var(--f-display)", fontStyle: "italic", fontSize: 13, flexShrink: 0,
                }}>{i.memberInitials}</div>
                <span style={{ fontWeight: 500, fontSize: 14, color: "var(--espresso-900)" }}>{i.member}</span>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                {c && adminCoachAvatar({ coach: c, size: 24 })}
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontSize: 13, color: "var(--espresso-900)" }}>{c?.name || "—"}</div>
                  <div className="mono" style={{ color: "var(--clay-600)", fontSize: 9 }}>{c?.role || ""}</div>
                </div>
              </div>
              <span style={{ fontSize: 13, color: "var(--espresso-900)" }}>{i.day} · {i.time}</span>
              <span className="mono" style={{ color: "var(--clay-600)" }}>{i.submitted}</span>
              {statusChip(i.status)}
              <div style={{ display: "flex", gap: 6, justifyContent: "flex-end" }}>
                {(i.status === "rejected" || i.status === "overdue") && openTriage && (
                  <button onClick={() => openTriage({
                    id: i.id,
                    client: { name: i.member, initials: i.memberInitials, tenure: "Member" },
                    coachId: i.coachId,
                    slot: { day: (i.day || "").split(",")[0].toUpperCase(), date: (i.day || "").split(", ")[1] || i.day, time: i.time, duration: i.duration || 60, room: "Ground floor studio" },
                    submittedAt: i.submitted || "Today",
                    reason: i.reason || "Pre-existing PT runs into the slot — no buffer to reset.",
                    sla: { deadline: "RESOLVE BY 8:00 PM TONIGHT", remaining: "3H 22M LEFT" },
                    availableCoachIds: ["deb", "anisha"].filter(id => id !== i.coachId),
                  })} className="mono" style={{
                    padding: "5px 10px", borderRadius: "var(--r-pill)",
                    border: "1px solid var(--terracotta-500)",
                    background: "var(--terracotta-500)", color: "var(--paper)",
                    cursor: "pointer", fontSize: 9.5, letterSpacing: 1.4,
                    display: "inline-flex", alignItems: "center", gap: 4,
                  }} title="Open decline triage">△ TRIAGE</button>
                )}
                <button onClick={() => toast(`Accepted ${i.member}`)} className="btn-icon" title="Accept" style={{ color: "var(--sage-500)" }}>✓</button>
                <button onClick={() => toast(`Rejected ${i.member}`)} className="btn-icon" title="Reject" style={{ color: "var(--terracotta-500)" }}>✗</button>
                <button onClick={() => setReassign(i)} className="btn-icon" title="Reassign" style={{ color: "var(--ochre-500)" }}>→</button>
              </div>
            </div>
          );
        })}
        {filtered.length === 0 && (
          <div style={{ padding: 32, textAlign: "center", color: "var(--clay-600)" }}>No invites match this filter.</div>
        )}
      </div>

      {reassign && <ReassignModal inv={reassign} onClose={() => setReassign(null)} onSend={(coach) => { setReassign(null); toast(`Reassigned ${reassign.member} → ${coach.name}`); }} />}
    </div>
  );
}

function ReassignModal({ inv, onClose, onSend }) {

  const [reason, setReason] = useStateAdm("");

  return (
    <div className="m3s-modal-backdrop" onClick={onClose}>

        <h3 className="serif" style={{ fontSize: 26, margin: "0 0 6px", color: "var(--espresso-900)" }}>{inv.member}</h3>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8, marginBottom: 16 }}>
          {TRAINERS.map(c => {
            const active = picked?.id === c.id;
            return (
              <button key={c.id} onClick={() => setPicked(c)} style={{
                display: "flex", flexDirection: "column", alignItems: "center", gap: 4,
                padding: 8, borderRadius: "var(--r-md)",

                background: active ? "var(--sand-100)" : "var(--paper)",

              }}>
                {adminCoachAvatar({ coach: c, size: 32 })}

              </button>
            );
          })}
        </div>

        <label className="mono" style={{ display: "block", color: "var(--clay-600)", marginBottom: 8 }}>Reason for reassignment</label>
        <input className="m3s-input" value={reason} onChange={e => setReason(e.target.value)} placeholder="e.g. Lee at capacity" />

        <div style={{ display: "flex", gap: 8, marginTop: 20, justifyContent: "flex-end" }}>
          <button className="btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn-primary" disabled={!picked} onClick={() => picked && onSend(picked)} style={{ background: "var(--terracotta-500)" }}>Reassign →</button>
        </div>
      </div>
    </div>
  );
}

// Studio-wide ratings panel rendered below the coach grid.
function AdminRatingsPanel() {
  const loadRatings = window.loadRatings || (() => []);
  const coachAverages = window.coachAverages || (() => null);
  const CRITERIA = window.RATING_CRITERIA || [];

  const all = loadRatings()
    .sort((a, b) => b.submittedAt.localeCompare(a.submittedAt));
  const coachIds = [...new Set(all.map(r => r.coachId))];

  const [selectedCoach, setSelectedCoach] = useStateAdm('all');
  const [selectedPeriod, setSelectedPeriod] = useStateAdm('all');

  const filtered = all.filter(r => {
    if (selectedCoach !== 'all' && r.coachId !== selectedCoach) return false;
    if (selectedPeriod === 'week') {
      const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 7);
      return new Date(r.sessionDate) >= cutoff;
    }
    if (selectedPeriod === 'month') {
      const cutoff = new Date(); cutoff.setMonth(cutoff.getMonth() - 1);
      return new Date(r.sessionDate) >= cutoff;
    }
    return true;
  });

  if (all.length === 0) {
    return (
      <div style={{
        marginTop: 36, padding: 32, borderRadius: 'var(--r-lg)',
        background: 'var(--paper)', border: '1px solid var(--hairline)',

      }}>
        <div className="mono" style={{ color: 'var(--clay-600)', marginBottom: 8 }}>● ALL MEMBER RATINGS</div>

      </div>
    );
  }

  return (
    <div style={{ marginTop: 36 }}>
      <div style={{
        fontFamily: 'var(--f-mono)', fontSize: 10, letterSpacing: 1.8,

            color: selectedCoach === id
              ? 'var(--paper)' : 'var(--clay-600)',
            fontFamily: 'var(--f-mono)', fontSize: 10,
            letterSpacing: 1.2, textTransform: 'uppercase',
            cursor: 'pointer',

              ? 'var(--paper)' : 'var(--clay-600)',
            fontFamily: 'var(--f-mono)', fontSize: 10,
            letterSpacing: 1.2, textTransform: 'uppercase',
            cursor: 'pointer',

      <div style={{
        background: 'var(--paper)', border: '1px solid var(--hairline)',
        borderRadius: 12, overflow: 'hidden', marginBottom: 24,
        boxShadow: 'var(--sh-2)',

function AdminPage({ coach, adminData, invites, setInvites, toast }) {
  const [tab, setTab] = useStateAdm("overview");
  const [triage, setTriage] = useStateAdm(null);
  const pendingCount = (invites || []).filter(i => i.status === "pending").length;
  const reviewItems = window.REVIEW_SEED || [];
  const reviewCount = reviewItems.filter(r => r.bucket === "today").length;

  function openTriage(opts) {
    const make = window.adminMakeTriageInvite || ((o) => o);
    setTriage(make(opts || {}));
    setTab("invites"); // breadcrumb says "Back to invites"
  }

  // Triage view replaces the normal tab body
  if (triage && window.AdminDeclineTriage) {
    return (
      <div data-screen-label="Admin Panel · Decline Triage">
        <AdminHeaderStrip adminData={adminData} />
        <AdminTabs tab={tab} setTab={(t) => { setTriage(null); setTab(t); }} canManageAdmins={!!adminData?.canManageAdmins} reviewCount={reviewCount} />
        <window.AdminDeclineTriage
          triage={triage}
          onClose={() => setTriage(null)}
          toast={toast}
        />
      </div>
    );
  }

  return (
    <div data-screen-label="Admin Panel">
      <AdminHeaderStrip adminData={adminData} />
      <AdminTabs tab={tab} setTab={setTab} canManageAdmins={!!adminData?.canManageAdmins} reviewCount={reviewCount} />
      {tab === "overview" && <AdminOverview toast={toast} invitesPendingCount={pendingCount} openTriage={openTriage} />}
      {tab === "calendar" && <AdminCalendarTab toast={toast} />}
      {tab === "invites"  && <AdminInvitesTab invites={invites} setInvites={setInvites} toast={toast} openTriage={openTriage} />}
      {tab === "review"   && window.AdminReviewTab && <window.AdminReviewTab items={reviewItems} toast={toast} />}
      {tab === "coaches"  && <AdminCoachesTab toast={toast} onJumpToCalendar={() => setTab("calendar")} />}
      {tab === "users"    && <AdminUsersTab adminData={adminData} toast={toast} />}
    </div>
  );
}

  sand50: '#FBF7F0', sand100: '#F5EDE0', sand200: '#EADBC4',
  paper: '#FFFDF8',
  clay500: '#A8825A', clay600: '#8A6640',
  walnut: '#5E4228', espresso800: '#3E2C1C', espresso900: '#241810',
  ochre: '#C99A3F', sage: '#7B8B6F', terra: '#B86B4B',
  ok: '#5E8A5E', warn: '#C97A3F', bad: '#B0463A',
  hairline: 'rgba(62,44,28,0.12)', hairlineStrong: 'rgba(62,44,28,0.22)',
  fDisplay: '"Instrument Serif", "Cormorant Garamond", Georgia, serif',
  fBody: '"Inter", system-ui, sans-serif',
  fMono: '"JetBrains Mono", ui-monospace, monospace',
};

// ─── Scoring logic ────────────────────────────────────────────────────────
function computeM3SScores(profile, bcaData, bloodData, mskData) {
  let strength = 5.0;
  if (profile.experience === '5+ years')    strength += 2.0;
  if (profile.experience === '2–5 years')   strength += 1.0;
  if (profile.experience === '6–24 months') strength += 0.0;
  if (profile.experience === '<6 months')   strength -= 1.0;
  if (profile.goal === 'Muscle Gain')       strength += 0.5;
  if (profile.goal === 'Strength')          strength += 0.8;
  if ((profile.daysPerWeek || 3) >= 4)      strength += 0.5;
  strength -= ((profile.injuries || []).length * 0.3);
  const mskPenalty = (mskData || [])
    .filter(m => m.status === 'Restricted' || m.status === 'Limited').length * 0.3;
  strength -= mskPenalty;
  strength = Math.min(10, Math.max(0, parseFloat(strength.toFixed(1))));

  let conditioning = 5.0;
  const [m5 = 30, s5 = 0] = (profile.running5k || '30:00').split(':').map(Number);
  const secs5k = m5 * 60 + s5;
  if (secs5k < 1380) conditioning += 2.5;
  else if (secs5k < 1620) conditioning += 1.5;
  else if (secs5k < 1860) conditioning += 0.5;
  else if (secs5k > 2100) conditioning -= 1.0;
  conditioning += (((profile.runRating || 5) - 5) * 0.3);
  if (profile.runFrequency === '4x / week')  conditioning += 1.0;
  if (profile.runFrequency === '3x / week')  conditioning += 0.6;
  if (profile.runFrequency === '2x / week')  conditioning += 0.2;
  if (profile.runFrequency === 'Never')      conditioning -= 1.0;
  conditioning = Math.min(10, Math.max(0, parseFloat(conditioning.toFixed(1))));

  let metabolic = 5.0;
  (bloodData || []).forEach(m => {
    if (m.status === 'Optimal' || m.status === 'Normal') metabolic += 0.3;
    if (m.status === 'High' || m.status === 'Low')       metabolic -= 0.4;
    if (m.status === 'Deficient')                        metabolic -= 0.7;
  });
  (bcaData || []).forEach(m => {
    if (m.accent === 'ok')   metabolic += 0.3;
    if (m.accent === 'warn') metabolic -= 0.3;
    if (m.accent === 'bad')  metabolic -= 0.5;
  });
  metabolic = Math.min(10, Math.max(0, parseFloat(metabolic.toFixed(1))));

  const overall = parseFloat(((strength + conditioning + metabolic) / 3).toFixed(1));
  return { overall, strength, conditioning, metabolic };
}

function m3sScoreLabel(n) {
  if (n >= 8.5) return 'Elite';
  if (n >= 7.0) return 'Advanced';
  if (n >= 5.5) return 'Intermediate';
  if (n >= 3.5) return 'Developing';
  return 'Foundation';
}

function m3sScoreReasons(dim, profile, bcaData, bloodData, mskData) {
  if (dim === 'strength') return [
    `Experience: ${profile.experience || 'not set'}`,
    `Training days: ${profile.daysPerWeek || '?'}× per week`,
    `Injuries: ${(profile.injuries || []).join(', ') || 'none'}`,
    `MSK flags: ${(mskData || []).filter(m =>
      m.status === 'Restricted' || m.status === 'Limited'
    ).map(m => m.area).join(', ') || 'none'}`,
  ];
  if (dim === 'conditioning') return [
    `5K time: ${profile.running5k || 'not set'}`,
    `2K time: ${profile.running2k || 'not set'}`,
    `Self-rating: ${profile.runRating || '?'}/10`,
    `Run frequency: ${profile.runFrequency || 'not set'}`,
  ];
  if (dim === 'metabolic') return [
    ...(bloodData || []).map(m => `${m.name}: ${m.value} ${m.unit} — ${m.status}`),
    ...(bcaData || []).map(m => `${m.label}: ${m.value} — ${m.range}`),
  ];
  return [];
}

// ─── Coach overrides (shared via localStorage) ────────────────────────────
const COACH_OVERRIDES_KEY = 'm3s.coachScoreOverrides';

function readCoachOverrides() {
  try {
    const raw = localStorage.getItem(COACH_OVERRIDES_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}

function writeCoachOverrides(next) {
  try { localStorage.setItem(COACH_OVERRIDES_KEY, JSON.stringify(next)); } catch {}
  // Notify any other open views in same tab
  try { window.dispatchEvent(new CustomEvent('m3s:coach-overrides', { detail: next })); } catch {}
}

// Merge coach overrides into computed scores. Override value (if present) replaces the system score.
function applyCoachOverrides(systemScores, overrides) {
  const merged = { ...systemScores };
  let any = false;
  ['strength', 'conditioning', 'metabolic'].forEach(d => {
    if (overrides[d] && typeof overrides[d].value === 'number') {
      merged[d] = overrides[d].value;
      any = true;
    }
  });
  if (any) {
    merged.overall = parseFloat(((merged.strength + merged.conditioning + merged.metabolic) / 3).toFixed(1));
  }
  // Overall-only override
  if (overrides.overall && typeof overrides.overall.value === 'number') {
    merged.overall = overrides.overall.value;
  }
  return merged;
}

// ─── Gauge SVG ────────────────────────────────────────────────────────────
const DIM_COLOR = {
  overall: FS_OT.ochre,
  strength: '#D9863A',     // warm amber
  conditioning: '#8FA67A', // sage-green
  metabolic: '#C67358',    // terra
};

function M3SGauge({ value = 0, max = 10, size = 'lg', color = FS_OT.ochre, label, sublabel, overridden = false, dark = true }) {
  const dims = size === 'lg'
    ? { W: 280, H: 200, cx: 140, cy: 158, rInner: 100, rOuter: 128, numFont: 64, ticks: 56, tickW: 2.2, axisFont: 11 }
    : { W: 160, H: 116, cx: 80,  cy: 92,  rInner: 56,  rOuter: 74,  numFont: 32, ticks: 36, tickW: 1.6, axisFont: 9 };

  // Arc spans π (left) → 2π (right), sweeping through top
  const ang = (t) => Math.PI + t * Math.PI;
  const pct = Math.max(0, Math.min(1, value / max));
  const activeCount = Math.round(pct * dims.ticks);

  const trackColor = dark ? 'rgba(255,253,248,0.10)' : FS_OT.hairlineStrong;
  const numColor = dark ? FS_OT.paper : FS_OT.espresso900;
  const labelColor = dark ? 'rgba(255,253,248,0.6)' : FS_OT.clay600;
  const axisColor = dark ? 'rgba(255,253,248,0.45)' : FS_OT.clay600;

  // Numerals every 2 across the /10 scale (0, 2, 4, 6, 8, 10)
  const numerals = [0, 2, 4, 6, 8, 10];

  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', userSelect: 'none' }}>
      <svg viewBox={`0 0 ${dims.W} ${dims.H}`} width={dims.W} style={{ display: 'block', maxWidth: '100%', height: 'auto' }}>
        {/* Tick marks */}
        {Array.from({ length: dims.ticks }).map((_, i) => {
          const t = i / (dims.ticks - 1);
          const a = ang(t);
          const x1 = dims.cx + dims.rInner * Math.cos(a);
          const y1 = dims.cy + dims.rInner * Math.sin(a);
          const x2 = dims.cx + dims.rOuter * Math.cos(a);
          const y2 = dims.cy + dims.rOuter * Math.sin(a);
          const active = i < activeCount;
          // Subtle fade on inactive
          const stroke = active ? color : trackColor;
          // Active ticks slightly longer at the tip for visual weight
          const w = active ? dims.tickW : dims.tickW * 0.7;
          return (
            <line key={i} x1={x1} y1={y1} x2={x2} y2={y2}
              stroke={stroke} strokeWidth={w} strokeLinecap="round"
              opacity={active ? (0.55 + 0.45 * (i / dims.ticks)) : 1} />
          );
        })}

        {/* Axis numerals — outside the arc */}
        {numerals.map((n) => {
          const t = n / 10;
          const a = ang(t);
          const r = dims.rOuter + (size === 'lg' ? 18 : 12);
          const x = dims.cx + r * Math.cos(a);
          const y = dims.cy + r * Math.sin(a);
          return (
            <text key={n} x={x} y={y + 3} textAnchor="middle"
              style={{ fontFamily: FS_OT.fMono, fontSize: dims.axisFont, fill: axisColor, fontWeight: 500 }}>
              {n}
            </text>
          );
        })}

        {/* Center: big number */}
        <text x={dims.cx} y={dims.cy - (size === 'lg' ? 14 : 6)} textAnchor="middle"
          style={{
            fontFamily: FS_OT.fDisplay, fontStyle: 'italic',
            fontSize: dims.numFont, fill: numColor, fontWeight: 400,
            letterSpacing: -1,
          }}>
          {value.toFixed(1)}
        </text>
      </svg>

      {(label || sublabel) && (
        <div style={{ textAlign: 'center', marginTop: size === 'lg' ? -8 : -4 }}>
          {label && (
            <div style={{
              fontFamily: FS_OT.fBody, fontSize: size === 'lg' ? 15 : 12,
              fontWeight: 600, color: numColor, letterSpacing: 0.2,
            }}>{label}</div>
          )}
          {sublabel && (
            <div style={{
              fontFamily: FS_OT.fDisplay, fontStyle: 'italic',
              fontSize: size === 'lg' ? 16 : 13,
              color, marginTop: 2,
              display: 'inline-flex', alignItems: 'center', gap: 6,
            }}>
              {sublabel}
              {overridden && (
                <span title="Adjusted by your coach" style={{
                  fontFamily: FS_OT.fMono, fontSize: 8, letterSpacing: 1.2,
                  padding: '2px 6px', borderRadius: 3,
                  background: dark ? 'rgba(201,154,63,0.18)' : 'rgba(201,154,63,0.15)',
                  color: FS_OT.ochre, fontStyle: 'normal', textTransform: 'uppercase',
                }}>Coach</span>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── Coach override editor (per-dimension) ────────────────────────────────
function CoachOverrideEditor({ dim, systemValue, current, onSave, onClear }) {
  const [open, setOpen] = React.useState(false);
  const [value, setValue] = React.useState(current?.value ?? systemValue);
  const [comment, setComment] = React.useState(current?.comment ?? '');

  React.useEffect(() => {
    setValue(current?.value ?? systemValue);
    setComment(current?.comment ?? '');
  }, [current, systemValue, open]);

  if (!open) {
    return (
      <button onClick={() => setOpen(true)} style={{
        fontFamily: FS_OT.fMono, fontSize: 9, letterSpacing: 1.4,
        padding: '6px 10px', borderRadius: 4, textTransform: 'uppercase',
        border: `1px solid ${FS_OT.hairlineStrong}`,
        background: 'transparent', color: FS_OT.walnut,
        cursor: 'pointer', fontWeight: 600,
      }}>
        {current ? '✎ Edit override' : '+ Coach override'}
      </button>
    );
  }
  return (
    <div style={{
      marginTop: 10, padding: 12, background: FS_OT.paper,
      border: `1px solid ${FS_OT.walnut}`, borderRadius: 8,
    }}>
      <div style={{ display: 'flex', gap: 10, alignItems: 'center', marginBottom: 8 }}>
        <div style={{ fontFamily: FS_OT.fMono, fontSize: 9, letterSpacing: 1.4, color: FS_OT.clay600, textTransform: 'uppercase' }}>
          Override score
        </div>
        <input type="number" min="0" max="10" step="0.1"
          value={value} onChange={(e) => setValue(parseFloat(e.target.value))}
          style={{
            fontFamily: FS_OT.fMono, fontSize: 14, fontWeight: 600,
            padding: '6px 10px', width: 70, borderRadius: 6,
            border: `1px solid ${FS_OT.hairlineStrong}`, color: FS_OT.espresso900,
          }} />
        <div style={{ fontFamily: FS_OT.fMono, fontSize: 10, color: FS_OT.clay600 }}>
          / 10 · system: {systemValue}
        </div>
      </div>
      <textarea
        placeholder="Why? (clients see this comment on their profile)"
        value={comment} onChange={(e) => setComment(e.target.value)}
        rows={2}
        style={{
          width: '100%', boxSizing: 'border-box',
          fontFamily: FS_OT.fBody, fontSize: 13, lineHeight: 1.5,
          padding: '8px 10px', borderRadius: 6, resize: 'vertical',
          border: `1px solid ${FS_OT.hairlineStrong}`, color: FS_OT.espresso900,
          background: FS_OT.sand50,
        }} />
      <div style={{ display: 'flex', gap: 6, marginTop: 8, justifyContent: 'flex-end' }}>
        {current && (
          <button onClick={() => { onClear(); setOpen(false); }} style={miniBtn(false, true)}>
            Clear
          </button>
        )}
        <button onClick={() => setOpen(false)} style={miniBtn(false)}>Cancel</button>
        <button onClick={() => { onSave({ value, comment }); setOpen(false); }} style={miniBtn(true)}>
          Save override
        </button>
      </div>
    </div>
  );
}

const miniBtn = (primary, danger) => ({
  fontFamily: FS_OT.fBody, fontSize: 12, fontWeight: 600,
  padding: '6px 12px', borderRadius: 6,
  border: primary ? 'none' : `1px solid ${FS_OT.hairlineStrong}`,
  background: primary ? FS_OT.walnut : 'transparent',
  color: danger ? FS_OT.bad : (primary ? FS_OT.paper : FS_OT.espresso900),
  cursor: 'pointer',
});

// ─── Main section ─────────────────────────────────────────────────────────
function FitnessScoreSection({ profile = {}, coachEditable = false }) {
  // Hardcoded BCA/Blood/MSK data — same values referenced across profile + onboarding
  const bcaData = [
    { label: 'Body fat',     value: '24.8%',   range: 'Slightly high',  accent: FS_OT.warn },
    { label: 'Muscle mass',  value: '49.2 kg', range: 'On track',       accent: FS_OT.ok },
    { label: 'Visceral fat', value: '8',       range: 'Healthy',        accent: FS_OT.ok },
    { label: 'Metabolic age',value: '34',      range: '2 yrs above',    accent: FS_OT.warn },
  ];
  const bloodData = [
    { name: 'Vit D',    value: '18',  unit: 'ng/mL', status: 'Deficient' },
    { name: 'LDL',      value: '148', unit: 'mg/dL', status: 'High' },
    { name: 'HbA1c',    value: '5.3', unit: '%',     status: 'Optimal' },
    { name: 'Ferritin', value: '52',  unit: 'ng/mL', status: 'Optimal' },
    { name: 'TSH',      value: '2.1', unit: 'mIU/L', status: 'Normal' },
  ];
  const mskData = [
    { area: 'Shoulders', status: 'Restricted' },
    { area: 'Hips',      status: 'Tight' },
    { area: 'Thoracic',  status: 'Limited' },
    { area: 'Knees',     status: 'Cleared' },
    { area: 'Lower back',status: 'Cleared' },
  ];

  const [overrides, setOverrides] = React.useState(readCoachOverrides);
  const [expanded, setExpanded] = React.useState(null);

  React.useEffect(() => {
    const onUpdate = () => setOverrides(readCoachOverrides());
    const onStorage = (e) => { if (e.key === COACH_OVERRIDES_KEY) setOverrides(readCoachOverrides()); };
    window.addEventListener('m3s:coach-overrides', onUpdate);
    window.addEventListener('storage', onStorage);
    return () => {
      window.removeEventListener('m3s:coach-overrides', onUpdate);
      window.removeEventListener('storage', onStorage);
    };
  }, []);

  const systemScores = computeM3SScores(profile, bcaData, bloodData, mskData);
  const scores = applyCoachOverrides(systemScores, overrides);

  function saveOverride(dim, payload) {
    const next = { ...overrides, [dim]: payload };
    setOverrides(next);
    writeCoachOverrides(next);
  }
  function clearOverride(dim) {
    const next = { ...overrides };
    delete next[dim];
    setOverrides(next);
    writeCoachOverrides(next);
  }

  const dims = ['strength', 'conditioning', 'metabolic'];
  const dimLabels = { strength: 'Strength', conditioning: 'Conditioning', metabolic: 'Metabolic' };

  return (
    <div style={{
      background: FS_OT.espresso900, color: FS_OT.paper,
      borderRadius: 18, padding: '24px 26px 22px',
      boxShadow: '0 20px 50px -20px rgba(62,44,28,0.35)',
      position: 'relative', overflow: 'hidden',
    }}>
      {/* Soft accent halo */}
      <div style={{
        position: 'absolute', top: -90, left: '50%', transform: 'translateX(-50%)',
        width: 360, height: 360, borderRadius: '50%',
        background: 'radial-gradient(circle, rgba(201,154,63,0.18), transparent 60%)',
        pointerEvents: 'none',
      }} />

      {/* Header label */}
      <div style={{ position: 'relative', textAlign: 'center', marginBottom: 6 }}>
        <div style={{
          fontFamily: FS_OT.fMono, fontSize: 10, letterSpacing: 2,
          color: 'rgba(255,253,248,0.55)', textTransform: 'uppercase', fontWeight: 500,
        }}>M3S Fitness Score</div>
      </div>

      {/* Overall — hero gauge */}
      <div style={{ position: 'relative', display: 'flex', justifyContent: 'center', marginTop: 8 }}>
        <M3SGauge
          value={scores.overall} max={10} size="lg"
          color={DIM_COLOR.overall}
          label="Fitness Level"
          sublabel={m3sScoreLabel(scores.overall)}
          overridden={!!overrides.overall}
          dark
        />
      </div>

      {/* Coach override for overall (coach-only) */}
      {coachEditable && (
        <div style={{
          position: 'relative', marginTop: 14, padding: '12px 14px',
          background: 'rgba(255,253,248,0.06)', borderRadius: 10,
          border: `1px solid rgba(255,253,248,0.12)`,
        }}>
          <div style={{
            fontFamily: FS_OT.fMono, fontSize: 9, letterSpacing: 1.5,
            color: 'rgba(255,253,248,0.6)', textTransform: 'uppercase', marginBottom: 8,
          }}>Coach input · overall</div>
          <CoachOverrideOnDark
            current={overrides.overall} systemValue={systemScores.overall}
            onSave={(v) => saveOverride('overall', v)}
            onClear={() => clearOverride('overall')} />
        </div>
      )}

      {/* Per-dimension gauges */}
      <div style={{
        position: 'relative', marginTop: 22,
        display: 'flex', gap: 14, justifyContent: 'space-around', alignItems: 'flex-start',
        paddingTop: 18, borderTop: '1px solid rgba(255,253,248,0.08)',
        flexWrap: 'wrap',
      }}>
        {dims.map(d => (
          <div key={d} style={{ flex: '1 1 140px', minWidth: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8 }}>
            <M3SGauge
              value={scores[d]} max={10} size="sm"
              color={DIM_COLOR[d]}
              label={dimLabels[d]}
              sublabel={m3sScoreLabel(scores[d])}
              overridden={!!overrides[d]}
              dark
            />
            <button
              onClick={() => setExpanded(expanded === d ? null : d)}
              style={{
                background: expanded === d ? 'rgba(255,253,248,0.10)' : 'transparent',
                border: `1px solid rgba(255,253,248,${expanded === d ? '0.22' : '0.14'})`,
                borderRadius: 999, padding: '5px 12px',
                fontFamily: FS_OT.fMono, fontSize: 8.5, letterSpacing: 1.3,
                color: 'rgba(255,253,248,0.75)', cursor: 'pointer',
                textTransform: 'uppercase', fontWeight: 600,
              }}>
              {expanded === d ? 'Hide breakdown ↑' : 'See breakdown ↓'}
            </button>
          </div>
        ))}
      </div>

      {/* Drill-down panel */}
      {expanded && (
        <div style={{
          position: 'relative', marginTop: 16, padding: '14px 16px',
          background: 'rgba(255,253,248,0.05)', borderRadius: 10,
          border: '1px solid rgba(255,253,248,0.10)',
        }}>
          <div style={{
            fontFamily: FS_OT.fMono, fontSize: 9, letterSpacing: 1.6,
            color: 'rgba(255,253,248,0.55)', textTransform: 'uppercase', marginBottom: 10,
          }}>
            Why {dimLabels[expanded]} is {scores[expanded]}/10
          </div>

          {/* Reasons */}
          {m3sScoreReasons(expanded, profile, bcaData, bloodData, mskData).map((r, i) => (
            <div key={i} style={{
              padding: '7px 0',
              borderTop: i === 0 ? 'none' : '1px solid rgba(255,253,248,0.08)',
              fontFamily: FS_OT.fBody, fontSize: 13, color: 'rgba(255,253,248,0.85)',
              lineHeight: 1.5,
            }}>{r}</div>
          ))}

          {/* Coach comment row */}
          <div style={{
            padding: '10px 12px', marginTop: 10, borderRadius: 8,
            background: overrides[expanded]
              ? 'rgba(201,154,63,0.12)' : 'rgba(255,253,248,0.04)',
            border: `1px solid ${overrides[expanded] ? 'rgba(201,154,63,0.35)' : 'rgba(255,253,248,0.08)'}`,
          }}>
            <div style={{
              fontFamily: FS_OT.fMono, fontSize: 8.5, letterSpacing: 1.4,
              color: overrides[expanded] ? FS_OT.ochre : 'rgba(255,253,248,0.5)',
              textTransform: 'uppercase', marginBottom: 6, fontWeight: 600,
            }}>
              Coach input · {expanded}
            </div>
            {overrides[expanded] ? (
              <>
                <div style={{
                  fontFamily: FS_OT.fBody, fontSize: 13, color: FS_OT.paper,
                  lineHeight: 1.55, fontStyle: overrides[expanded].comment ? 'normal' : 'italic',
                }}>
                  {overrides[expanded].comment || 'Coach adjusted score without comment.'}
                </div>
                <div style={{
                  marginTop: 6, fontFamily: FS_OT.fMono, fontSize: 9,
                  letterSpacing: 1.2, color: 'rgba(255,253,248,0.55)',
                }}>
                  ADJUSTED · system was {systemScores[expanded]}/10
                </div>
              </>
            ) : (
              <div style={{
                fontFamily: FS_OT.fBody, fontStyle: 'italic', fontSize: 13,
                color: 'rgba(255,253,248,0.55)', lineHeight: 1.5,
              }}>
                {coachEditable
                  ? 'No coach override yet — add one below.'
                  : 'No coach comment yet — request a review at your next session.'}
              </div>
            )}

            {coachEditable && (
              <div style={{ marginTop: 10 }}>
                <CoachOverrideOnDark
                  current={overrides[expanded]} systemValue={systemScores[expanded]}
                  onSave={(v) => saveOverride(expanded, v)}
                  onClear={() => clearOverride(expanded)} />
              </div>
            )}
          </div>
        </div>
      )}

      {/* Footer note */}
      <div style={{
        position: 'relative', marginTop: 16, paddingTop: 14,
        borderTop: '1px solid rgba(255,253,248,0.08)',
        fontFamily: FS_OT.fBody, fontSize: 12, color: 'rgba(255,253,248,0.6)',
        lineHeight: 1.5, textAlign: 'center',
      }}>
        {coachEditable
          ? <>Adjust any dimension if the system score doesn{'\u2019'}t reflect what you{'\u2019'}re seeing in person — your client{'\u2019'}s profile updates live.</>
          : <>Calculated from your BCA, blood panel, MSK assessment &amp; running data. <strong style={{ color: FS_OT.ochre, fontWeight: 600 }}>Coach input</strong> can override any dimension.</>}
      </div>
    </div>
  );
}

const { useState: mUseState, useEffect: mUseEffect, useMemo: mUseMemo } = React;

// ─── Breakpoints + hook ──────────────────────────────────────────────

  mobile:    '(max-width: 767px)',

  desktop:   '(min-width: 1024px)',
  landscape: '(min-width: 568px) and (max-width: 899px) and (orientation: landscape)',
};

function useMediaQuery(query) {
  const [matches, setMatches] = mUseState(false);
  mUseEffect(() => {
    const m = window.matchMedia(query);
    setMatches(m.matches);
    const handler = (e) => setMatches(e.matches);
    m.addEventListener('change', handler);
    return () => m.removeEventListener('change', handler);
  }, [query]);
  return matches;
}

// ─── Demo "now" ──────────────────────────────────────────────────────
const DEMO_NOW = new Date(2026, 3, 20, 9, 13);
const WEEK_START = new Date(2026, 3, 20); // Mon Apr 20
function startOfDay(d) { const x = new Date(d); x.setHours(0,0,0,0); return x; }
function dayIdxFor(d) {
  const diff = Math.floor((startOfDay(d) - startOfDay(WEEK_START)) / 86400000);
  return ((diff % 7) + 7) % 7;
}
function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function fmtMobileTime(mins) {
  const h = Math.floor(mins / 60), m = mins % 60;
  const ampm = h < 12 ? 'AM' : 'PM';
  const hh = ((h + 11) % 12) + 1;
  return `${hh}:${String(m).padStart(2, '0')} ${ampm}`;
}
function eventKindLabel(kind) {
  return ({ pt: 'PT Session', group: 'Group Class', pending: 'Pending invite', block: 'Off / Blocked' }[kind] || kind);

function kindBorderColor(kind) {

function kindTintBg(kind) {

function statusFor(ev) {
  const nowMins = DEMO_NOW.getHours() * 60 + DEMO_NOW.getMinutes();

  lock:    <Icn size={20} d={<><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></>} />,
  shield:  <Icn size={20} d={<path d="M12 3l8 3v6c0 4.5-3.5 8-8 9-4.5-1-8-4.5-8-9V6l8-3z"/>} />,

};

// ─── HOME (today's "Up next") ────────────────────────────────────────
function MobileHomeTab({ coach, events, openClient, clients, onJumpToCalendar }) {
  const todayIdx = dayIdxFor(DEMO_NOW);
  const today = events[todayIdx] || [];
  const sorted = [...today].sort((a, b) => a.start - b.start);
  const nowMins = DEMO_NOW.getHours() * 60 + DEMO_NOW.getMinutes();
  const upcoming = sorted.find(e => e.end > nowMins && e.kind !== 'block');
  const within4h = upcoming && (upcoming.start - nowMins) <= 240 && (upcoming.start - nowMins) >= -15;

  const dayName   = DEMO_NOW.toLocaleDateString('en-US', { weekday: 'long' });
  const dateLabel = DEMO_NOW.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const [expandedId, setExpandedId] = mUseState(null);

  function clientNameFromTitle(title) {
    const m = /·\s+(.+)$/.exec(title);
    return m ? m[1].trim() : title;
  }
  function clientFromTitle(title) {
    const n = clientNameFromTitle(title);
    return (clients || []).find(c => n.startsWith(c.name.split(' ')[0]));
  }
  function countdownLabel(mins) {
    const diff = mins - nowMins;
    if (diff < 0)  return 'STARTED';
    if (diff < 60) return `IN ${diff} MINUTES`;
    const h = Math.floor(diff / 60), m = diff % 60;
    return m ? `IN ${h}H ${m}M` : `IN ${h}H`;
  }

  return (
    <div style={{ padding: 16, paddingBottom: 96 }}>
      <div className="mono" style={{
        color: 'var(--clay-600)', marginBottom: 10,
        display: 'inline-flex', alignItems: 'center', gap: 8,
      }}>
        <span style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--ochre-500)' }} />
        TODAY · {dayName.toUpperCase()}, {dateLabel.toUpperCase()}
      </div>
      <h1 className="serif" style={{
        fontSize: 28, fontStyle: 'italic', margin: '0 0 18px',
        color: 'var(--espresso-900)', lineHeight: 1.1, letterSpacing: '-0.01em',
      }}>{upcoming ? 'Up next.' : "You're free."}</h1>

      {within4h && (
        <div style={{
          background: 'var(--paper)', borderRadius: 'var(--r-xl)',
          padding: 20, boxShadow: 'var(--sh-2)',
          border: '1px solid var(--hairline)', marginBottom: 24,
        }}>
          <span className="mono" style={{
            display: 'inline-block',
            background: 'var(--ochre-500)', color: 'var(--espresso-900)',
            padding: '4px 10px', borderRadius: 999,
            fontSize: 10, fontWeight: 700, letterSpacing: 1.4, marginBottom: 14,
          }}>{countdownLabel(upcoming.start)}</span>
          <div style={{ fontFamily: 'var(--f-body)', fontWeight: 700, fontSize: 24, color: 'var(--espresso-900)', lineHeight: 1 }}>
            {fmtMobileTime(upcoming.start)}
          </div>
          <div className="serif" style={{
            fontSize: 22, fontStyle: 'italic', color: 'var(--walnut-700)',
            margin: '6px 0 2px', letterSpacing: '-0.01em',
          }}>{clientNameFromTitle(upcoming.title)}</div>
          <div style={{ color: 'var(--clay-600)', fontSize: 14, marginBottom: 14 }}>
            {eventKindLabel(upcoming.kind)} · {upcoming.end - upcoming.start} min
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            {(() => {
              const cl = clientFromTitle(upcoming.title);
              return cl ? (
                <button onClick={() => openClient(cl)} style={mobilePillPrimary}>View client →</button>
              ) : null;
            })()}
            <button onClick={onJumpToCalendar} style={mobilePillGhost}>Full calendar →</button>
          </div>
        </div>
      )}

      {sorted.length === 0 && (
        <div style={{ background: 'var(--sage-200)', borderRadius: 'var(--r-lg)', padding: 24, textAlign: 'center' }}>

        </div>

      {sorted.length > 0 && (
        <>
          <div className="mono" style={{ color: 'var(--clay-600)', marginBottom: 10 }}>— {sorted.length} EVENTS TODAY</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {sorted.map(ev => {
              const status = statusFor(ev);
              const isExp = expandedId === ev.id;
              const cl = clientFromTitle(ev.title);
              const isClient = ev.kind === 'pt' || ev.kind === 'pending';
              return (
                <div key={ev.id} style={{
                  background: 'var(--paper)', borderRadius: 'var(--r-md)',
                  border: '1px solid var(--hairline)', overflow: 'hidden',

                    width: '100%', textAlign: 'left', background: 'transparent', border: 'none',
                    padding: '12px 14px', cursor: 'pointer',
                    display: 'grid', gridTemplateColumns: '54px 1fr auto',
                    gap: 12, alignItems: 'center',
                  }}>
                    <span className="mono" style={{ color: 'var(--clay-600)', fontSize: 11, letterSpacing: 1 }}>
                      {fmtMobileTime(ev.start)}
                    </span>
                    <span style={{ minWidth: 0 }}>
                      <div style={{
                        fontWeight: 500, fontSize: 14, color: 'var(--espresso-900)',
                        whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                      }}>{clientNameFromTitle(ev.title)}</div>
                      <div className="mono" style={{ color: 'var(--clay-600)', fontSize: 9, marginTop: 2 }}>
                        {eventKindLabel(ev.kind).toUpperCase()}
                      </div>
                    </span>
                    <span className="mono" style={{
                      background: status.bg, color: status.fg,
                      padding: '3px 8px', borderRadius: 999,
                      fontSize: 9, fontWeight: 700, letterSpacing: 1.2, whiteSpace: 'nowrap',
                    }}>{status.label}</span>
                  </button>
                  {isExp && (
                    <div style={{ borderTop: '1px solid var(--hairline)', padding: '10px 14px 12px', display: 'flex', gap: 8, flexWrap: 'wrap' }}>

                      <button style={mobilePillGhost}>Note →</button>
                      <button style={mobilePillGhost}>Reschedule</button>
                    </div>

                </div>

            })}

        </>
      )}
    </div>
  );
}

// ─── INVITES ─────────────────────────────────────────────────────────
function MobileInvitesTab({ invites, setInvites, toast }) {
  const [filter, setFilter] = mUseState('ALL');
  const [expandedId, setExpandedId] = mUseState(null);
  const pending = invites.filter(i => i.status === 'pending');

  const filtered = filter === 'WAITLIST'
    ? invites.filter(i => i.status === 'alternate-sent')
    : filter === 'NEW'
    ? pending.filter(i => /hr|hrs/.test(i.requestedAt))
    : pending;

  function accept(inv) {
    setInvites(invites.map(i => i.id === inv.id ? { ...i, status: 'accepted' } : i));
    toast(`Confirmed — ${inv.member}`);
  }
  function reject(inv) {
    setInvites(invites.map(i => i.id === inv.id ? { ...i, status: 'rejected' } : i));
    toast(`Declined — ${inv.member}`);
  }
  function reassign() { toast('Reassign flow opens here'); }

  return (
    <div style={{ padding: 16, paddingBottom: 96 }}>
      <div className="mono" style={{
        color: 'var(--clay-600)', marginBottom: 10,
        display: 'inline-flex', alignItems: 'center', gap: 8,
      }}>
        <span style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--ochre-500)' }} />
        PT INVITES · {pending.length} PENDING
      </div>
      <h1 className="serif" style={{
        fontSize: 28, fontStyle: 'italic', margin: '0 0 18px',
        color: 'var(--espresso-900)', lineHeight: 1.1, letterSpacing: '-0.01em',
      }}>Awaiting your response.</h1>

      <div className="tab-row" style={{
        display: 'flex', gap: 8, marginBottom: 16,
        overflowX: 'auto', scrollbarWidth: 'none',
        marginLeft: -16, marginRight: -16, padding: '0 16px',
      }}>
        {['ALL', 'NEW', 'WAITLIST'].map(k => {
          const active = filter === k;
          return (
            <button key={k} onClick={() => setFilter(k)} className="mono" style={{
              padding: '8px 14px', borderRadius: 999, whiteSpace: 'nowrap',
              border: '1px solid ' + (active ? 'var(--walnut-700)' : 'var(--hairline-strong)'),
              background: active ? 'var(--walnut-700)' : 'var(--paper)',
              color: active ? 'var(--paper)' : 'var(--walnut-700)',
              fontFamily: 'var(--f-mono)', fontSize: 9, letterSpacing: 1.5, cursor: 'pointer',
            }}>{k}</button>

        })}
      </div>

      {filtered.length === 0 && (
        <div style={{
          background: 'var(--paper)', border: '1px solid var(--hairline)',
          borderRadius: 'var(--r-lg)', padding: 32, textAlign: 'center', color: 'var(--clay-600)',
        }}>
          <div style={{ fontSize: 32, opacity: 0.3, marginBottom: 6 }}>✓</div>
          All caught up.
        </div>
      )}

      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        {filtered.map(inv => {
          const isExp = expandedId === inv.id;
          return (
            <div key={inv.id} style={{
              background: 'var(--paper)', borderRadius: 'var(--r-lg)',
              border: '1px solid var(--hairline)', boxShadow: 'var(--sh-1)', padding: 16,
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <div style={{
                  width: 40, height: 40, borderRadius: '50%',
                  background: 'var(--sand-200)', color: 'var(--walnut-700)',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  fontFamily: 'var(--f-display)', fontStyle: 'italic', fontSize: 15, flexShrink: 0,
                }}>{inv.memberInitials}</div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontFamily: 'var(--f-body)', fontWeight: 600, fontSize: 14, color: 'var(--espresso-900)' }}>{inv.member}</div>
                </div>
                <span className="mono" style={{ color: 'var(--clay-600)', fontSize: 9, whiteSpace: 'nowrap' }}>{inv.requestedAt.toUpperCase()}</span>
              </div>

              <div style={{ fontSize: 14, color: 'var(--espresso-900)', marginTop: 10 }}>
                {inv.day} · <strong style={{ fontWeight: 600 }}>{inv.time}</strong>

              <div style={{ marginTop: 8 }}>
                <span className="mono" style={{
                  background: 'var(--sand-100)', color: 'var(--walnut-700)',
                  padding: '4px 10px', borderRadius: 999,
                  fontSize: 9, letterSpacing: 1.5, fontWeight: 600,
                  border: '1px solid var(--hairline)',
                }}>STRENGTH</span>
              </div>

              <button onClick={() => setExpandedId(isExp ? null : inv.id)} style={{
                background: 'transparent', border: 'none', cursor: 'pointer',
                color: 'var(--clay-600)', fontSize: 13, padding: '10px 0 0',
                fontFamily: 'var(--f-body)', fontStyle: 'italic', display: 'inline-block',
              }}>{isExp ? '— hide notes' : `"${inv.note.slice(0, 56)}${inv.note.length > 56 ? '…' : ''}"`}</button>
