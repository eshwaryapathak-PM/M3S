                <p style={{
                  marginTop: 8, padding: 12, borderRadius: 'var(--r-md)',
                  background: 'var(--sand-50)', border: '1px solid var(--hairline)',

                    background: 'var(--sage-500)', color: 'var(--paper)',
                    fontFamily: 'var(--f-body)', fontSize: 13, fontWeight: 600, cursor: 'pointer',
                  }}>✓ Accept</button>
                  <button onClick={() => reject(inv)} style={{
                    padding: '10px 14px', borderRadius: 999,
                    background: 'transparent', color: 'var(--clay-600)',
                    border: '1px solid var(--hairline-strong)',
                    fontFamily: 'var(--f-body)', fontSize: 13, cursor: 'pointer',
                  }}>✗ Reject</button>
                  <button onClick={reassign} style={{
                    padding: '10px 14px', borderRadius: 999,
                    background: 'transparent', color: 'var(--clay-600)',
                    border: '1px solid var(--hairline-strong)',
                    fontFamily: 'var(--f-body)', fontSize: 13, cursor: 'pointer',
                  }}>→ Reassign</button>
                </div>
              ) : (
                <div style={{ marginTop: 14 }}>
                  <span className="mono" style={{
                    background: inv.status === 'accepted' ? 'var(--sage-200)' : 'var(--terracotta-200)',
                    color: inv.status === 'accepted' ? 'var(--sage-500)' : 'var(--terracotta-500)',
                    padding: '5px 12px', borderRadius: 999,
                    fontSize: 10, fontWeight: 700, letterSpacing: 1.5,
                  }}>{inv.status.toUpperCase()}</span>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── MOBILE CALENDAR (Agenda / 3-Day / Month) ────────────────────────
function MobileCalendarPage({ coach, events, onEventTap, onNewBlock }) {
  // calDate is anchored to the demo Apr-2026 week so events render.
  const [calDate, setCalDate] = mUseState(new Date(2026, 3, 20));
  const [calView, setCalView] = mUseState('3day');

  function shiftBy(days) {
    const d = new Date(calDate); d.setDate(d.getDate() + days); setCalDate(d);
  }
  function shiftMonth(n) {
    const d = new Date(calDate); d.setMonth(d.getMonth() + n); setCalDate(d);
  }
  const monthLabel = calDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const showToday = !isSameDay(calDate, DEMO_NOW);

  return (
    <div style={{ paddingBottom: 96 }}>
      {/* Sticky header */}
      <div style={{
        position: 'sticky', top: 56, zIndex: 12, background: 'var(--paper)',
        padding: '12px 16px', borderBottom: '1px solid var(--hairline)',
      }}>
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          marginBottom: 10, gap: 12,
        }}>
          <div className="serif" style={{
            fontSize: 24, fontStyle: 'italic', color: 'var(--espresso-900)', letterSpacing: '-0.01em',
          }}>{monthLabel}</div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            <button aria-label="Previous" onClick={() => calView === 'month' ? shiftMonth(-1) : shiftBy(calView === '3day' ? -3 : -1)} style={iconBtn}>
              {ICON.chevL}
            </button>
            {showToday && (
              <button onClick={() => setCalDate(new Date(2026, 3, 20))} className="mono" style={{
                padding: '4px 10px', borderRadius: 999,
                background: 'var(--sand-100)', color: 'var(--clay-600)',
                border: '1px solid var(--hairline)',
                fontSize: 9, letterSpacing: 1.5, cursor: 'pointer',
              }}>TODAY</button>
            )}
            <button aria-label="Next" onClick={() => calView === 'month' ? shiftMonth(1) : shiftBy(calView === '3day' ? 3 : 1)} style={iconBtn}>
              {ICON.chevR}
            </button>
          </div>
        </div>

        {/* Segmented view switcher */}
        <div style={{
          display: 'flex',
          background: 'var(--sand-100)', borderRadius: 999, padding: 4, height: 32,
        }}>
          {[['day','AGENDA'], ['3day','3-DAY'], ['month','MONTH']].map(([id, label]) => {
            const active = calView === id;
            return (
              <button key={id} onClick={() => setCalView(id)} className="mono" style={{
                flex: 1, border: 'none', borderRadius: 999, cursor: 'pointer',
                background: active ? 'var(--paper)' : 'transparent',
                color:      active ? 'var(--walnut-700)' : 'var(--clay-600)',
                boxShadow:  active ? 'var(--sh-1)' : 'none',
                fontSize: 9, letterSpacing: 1.2, fontFamily: 'var(--f-mono)',
              }}>{label}</button>
            );
          })}
        </div>
      </div>

      {calView === 'day'   && <CalAgendaView   date={calDate} events={events} onTap={onEventTap} />}
      {calView === '3day'  && <CalThreeDayView date={calDate} events={events} onTap={onEventTap} onShift={shiftBy} />}
      {calView === 'month' && <CalMonthView    date={calDate} events={events} onPickDay={(d) => { setCalDate(d); setCalView('day'); }} />}

      <button onClick={onNewBlock} aria-label="Block time" style={{
        position: 'fixed', right: 16, bottom: 88, zIndex: 25,
        width: 56, height: 56, borderRadius: '50%',
        background: 'var(--walnut-700)', color: 'var(--paper)',
        border: 'none', cursor: 'pointer', boxShadow: 'var(--sh-3)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
      }}>{ICON.plus}</button>
    </div>
  );
}

const iconBtn = {
  width: 36, height: 36, display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
  borderRadius: 999, border: 'none', background: 'transparent',
  color: 'var(--clay-600)', cursor: 'pointer',
};

// ── Agenda view ──
function CalAgendaView({ date, events, onTap }) {
  const idx = dayIdxFor(date);
  const day = (events[idx] || []).slice().sort((a,b) => a.start - b.start);
  const totalMins = day.reduce((s, e) => s + (e.end - e.start), 0);
  const hours = (totalMins / 60).toFixed(totalMins % 60 ? 1 : 0);
  const dayName = date.toLocaleDateString('en-US', { weekday: 'long' });
  const dateLabel = date.toLocaleDateString('en-US', { day: 'numeric', month: 'long' });

  const isToday = isSameDay(date, DEMO_NOW);
  const nowMins = DEMO_NOW.getHours() * 60 + DEMO_NOW.getMinutes();

  return (
    <div>
      <div style={{ padding: '14px 16px 8px' }}>
        <div style={{ fontFamily: 'var(--f-body)', fontWeight: 600, fontSize: 16, color: 'var(--espresso-900)' }}>
          {dayName}, {dateLabel}
        </div>
        <div className="mono" style={{ color: 'var(--clay-600)', fontSize: 9, marginTop: 3, letterSpacing: 1.4 }}>
          {day.length} {day.length === 1 ? 'EVENT' : 'EVENTS'} · {hours}H SCHEDULED
        </div>
      </div>

      {day.length === 0 && (
        <div style={{ padding: '48px 24px', textAlign: 'center' }}>
          <div className="mono" style={{ color: 'var(--clay-600)', marginBottom: 6 }}>NO EVENTS</div>
          <div style={{ fontSize: 13, color: 'var(--clay-600)', fontStyle: 'italic' }}>You're free today. Enjoy.</div>
        </div>
      )}

      <div style={{ padding: '0 16px', display: 'flex', flexDirection: 'column', gap: 8 }}>
        {day.map(ev => {
          const status = statusFor(ev);
          const currentLine = isToday && nowMins >= ev.start && nowMins <= ev.end;
          return (
            <button key={ev.id} onClick={() => onTap && onTap(ev, idx)} style={{
              all: 'unset', cursor: 'pointer',
              background: 'var(--paper)', borderRadius: 'var(--r-md)',
              padding: '12px 14px', border: '1px solid var(--hairline)',
              display: 'grid', gridTemplateColumns: '64px 1fr', gap: 14,
              position: 'relative', overflow: 'hidden',
            }}>
              <div>
                <div className="mono" style={{ color: 'var(--espresso-900)', fontSize: 11, letterSpacing: 0.5, fontWeight: 600 }}>
                  {fmtMobileTime(ev.start)}
                </div>
                <div className="mono" style={{ color: 'var(--clay-600)', fontSize: 9, marginTop: 2 }}>
                  {ev.end - ev.start} MIN
                </div>
              </div>
              <div style={{
                borderLeft: '3px solid ' + kindBorderColor(ev.kind),
                paddingLeft: 12, minWidth: 0,
              }}>
                <div style={{
                  fontWeight: 600, fontSize: 14, color: 'var(--espresso-900)',
                  whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                }}>{ev.title.replace(/^(PT|Group|Invite|Off)\s*·\s*/, '')}</div>
                <div className="mono" style={{ color: 'var(--clay-600)', fontSize: 9, marginTop: 3, letterSpacing: 1.2 }}>
                  {eventKindLabel(ev.kind).toUpperCase()}
                </div>
              </div>
              <span className="mono" style={{
                position: 'absolute', top: 12, right: 12,
                background: status.bg, color: status.fg,
                padding: '3px 8px', borderRadius: 999,
                fontSize: 9, fontWeight: 700, letterSpacing: 1.2,
              }}>{status.label}</span>
              {currentLine && (
                <div style={{
                  position: 'absolute', left: 0, right: 0, bottom: -1, height: 2,
                  background: 'var(--terracotta-500)',
                }} />
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ── 3-Day view ──
function CalThreeDayView({ date, events, onTap, onShift }) {
  const HOUR_PX = 56;
  const START_H = 6, END_H = 21;
  const hours = []; for (let h = START_H; h <= END_H; h++) hours.push(h);
  const days = [0,1,2].map(i => { const d = new Date(date); d.setDate(d.getDate() + i); return d; });
  const nowMins = DEMO_NOW.getHours() * 60 + DEMO_NOW.getMinutes();

  return (
    <div>
      {/* Day headers */}
      <div style={{
        position: 'sticky', top: 'calc(56px + 84px)', zIndex: 8,
        display: 'grid', gridTemplateColumns: '52px repeat(3, 1fr)',
        background: 'var(--paper)', borderBottom: '1px solid var(--hairline)',
      }}>
        <div />
        {days.map((d, i) => {
          const today = isSameDay(d, DEMO_NOW);
          return (
            <div key={i} style={{ padding: '10px 0', textAlign: 'center', borderLeft: '1px solid var(--hairline)' }}>
              <div className="mono" style={{ color: 'var(--clay-600)', fontSize: 9, letterSpacing: 1.2 }}>
                {d.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase()}
              </div>
              <div style={{
                fontFamily: 'var(--f-body)', fontWeight: 600, fontSize: 18,
                color: today ? 'var(--ochre-500)' : 'var(--espresso-900)', marginTop: 2,
              }}>{d.getDate()}</div>
            </div>
          );
        })}
      </div>

      {/* Swipe handlers via simple buttons */}
      <div style={{
        display: 'grid', gridTemplateColumns: '52px repeat(3, 1fr)',
        position: 'relative', minHeight: hours.length * HOUR_PX,
      }}>
        <div>
          {hours.map(h => (
            <div key={h} className="mono" style={{
              height: HOUR_PX, padding: '4px 6px 0 0',
              fontSize: 9, color: 'var(--clay-600)', textAlign: 'right',
              letterSpacing: 1,
            }}>{fmtMobileTime(h * 60).replace(':00 ', ' ')}</div>
          ))}
        </div>
        {days.map((d, di) => {
          const idx = dayIdxFor(d);
          const dayEv = (events[idx] || []);
          const isToday = isSameDay(d, DEMO_NOW);
          return (
            <div key={di} style={{
              borderLeft: '1px solid var(--hairline)', position: 'relative',
              minHeight: hours.length * HOUR_PX,
            }}>
              {hours.map(h => (
                <div key={h} style={{ height: HOUR_PX, borderTop: '1px solid var(--hairline)' }} />
              ))}
              {isToday && nowMins >= START_H * 60 && nowMins <= END_H * 60 && (
                <div style={{
                  position: 'absolute', left: 0, right: 0,
                  top: ((nowMins - START_H * 60) / 60) * HOUR_PX,
                  height: 2, background: 'var(--terracotta-500)', zIndex: 4,
                }} />
              )}
              {dayEv.map(ev => {
                const start = Math.max(ev.start, START_H * 60);
                const end = Math.min(ev.end, END_H * 60 + 60);
                if (end <= start) return null;
                const top = ((start - START_H * 60) / 60) * HOUR_PX;
                const h = Math.max(22, ((end - start) / 60) * HOUR_PX - 2);
                return (
                  <button key={ev.id} onClick={() => onTap && onTap(ev, idx)} style={{
                    position: 'absolute', top, height: h,
                    left: '2.5%', width: '95%',
                    background: kindTintBg(ev.kind),
                    borderLeft: '3px solid ' + kindBorderColor(ev.kind),
                    borderRadius: 6, padding: '4px 6px',
                    cursor: 'pointer', textAlign: 'left',
                    overflow: 'hidden', border: '1px solid rgba(0,0,0,0.04)',
                    borderLeftWidth: 3,
                    display: 'flex', flexDirection: 'column', gap: 1,
                  }}>
                    <span className="mono" style={{ fontSize: 8, color: 'var(--espresso-800)', letterSpacing: 0.5 }}>
                      {fmtMobileTime(ev.start)}
                    </span>
                    <span style={{
                      fontWeight: 600, fontSize: 11, color: 'var(--espresso-900)',
                      whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                      lineHeight: 1.2,
                    }}>{ev.title.replace(/^(PT|Group|Invite|Off)\s*·\s*/, '')}</span>
                  </button>
                );
              })}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Month view ──
function CalMonthView({ date, events, onPickDay }) {
  const y = date.getFullYear(), m = date.getMonth();
  const first = new Date(y, m, 1);
  // Start from Sunday of the week containing the 1st
  const startGrid = new Date(first);
  startGrid.setDate(first.getDate() - first.getDay());
  const cells = []; for (let i = 0; i < 42; i++) {
    const d = new Date(startGrid); d.setDate(startGrid.getDate() + i); cells.push(d);
  }

  function eventsForDate(d) {
    // Map the demo events (keyed 0..6 from Mon Apr 20) onto real dates in the week of Apr 20
    const diff = Math.floor((startOfDay(d) - startOfDay(WEEK_START)) / 86400000);
    if (diff >= 0 && diff < 7) return events[diff] || [];
    return [];
  }

  return (
    <div>
      {/* DOW header */}
      <div style={{
        display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)',
        background: 'var(--paper)', borderBottom: '1px solid var(--hairline)',
      }}>
        {['S','M','T','W','T','F','S'].map((d, i) => (
          <div key={i} className="mono" style={{
            padding: '10px 0', textAlign: 'center',
            color: 'var(--clay-600)', fontSize: 9, letterSpacing: 1.2,
          }}>{d}</div>
        ))}
      </div>

      <div style={{
        display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)',
        gridAutoRows: 'minmax(76px, 1fr)',
      }}>
        {cells.map((d, i) => {
          const inMonth = d.getMonth() === m;
          const today = isSameDay(d, DEMO_NOW);
          const dayEv = eventsForDate(d);
          return (
            <button key={i} onClick={() => onPickDay(d)} style={{
              all: 'unset', cursor: 'pointer',
              borderRight: '1px solid var(--hairline)',
              borderBottom: '1px solid var(--hairline)',
              padding: 6, minHeight: 76, display: 'flex', flexDirection: 'column', gap: 3,
              background: inMonth ? 'var(--paper)' : 'var(--sand-50)',
              opacity: inMonth ? 1 : 0.6,
            }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'flex-end' }}>
                <span style={{
                  width: 22, height: 22, borderRadius: '50%',
                  display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                  fontSize: 12, fontWeight: 500,
                  background: today ? 'var(--ochre-500)' : 'transparent',
                  color: today ? 'var(--espresso-900)' : (inMonth ? 'var(--espresso-900)' : 'var(--clay-600)'),
                }}>{d.getDate()}</span>
              </div>
              {dayEv.slice(0, 3).map(ev => (
                <div key={ev.id} style={{
                  height: 4, borderRadius: 2,
                  background: kindBorderColor(ev.kind),
                  width: '100%',
                }} />
              ))}
              {dayEv.length > 3 && (
                <div className="mono" style={{ color: 'var(--clay-600)', fontSize: 8, letterSpacing: 0.6 }}>
                  +{dayEv.length - 3}
                </div>
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ─── Mobile shell — orchestrator ─────────────────────────────────────
function MobileShell(props) {
  const {
    coach, clients, invites, setInvites, events, setEvents,
    adminData, toast, onLogout,
  } = props;

  const [mobileTab, setMobileTab] = mUseState('home');
  const [moreSheetOpen, setMoreSheetOpen] = mUseState(false);

  // Allow parent preview page to jump to a tab via postMessage
  mUseEffect(() => {
    function handler(e) {
      if (e.data && e.data.type === 'jumpMobileTab') {
        const t = e.data.tab;
        setMoreSheetOpen(t === 'more');
        if (t !== 'more') setMobileTab(t);
      }
    }
    window.addEventListener('message', handler);
    return () => window.removeEventListener('message', handler);
  }, []);
  const [openClientObj, setOpenClientObj] = mUseState(null);
  const [gate, setGate] = mUseState(null);
  const [showBlock, setShowBlock] = mUseState(false);
  const [selectedEvent, setSelectedEvent] = mUseState(null);
  const pendingCount = invites.filter(i => i.status === 'pending').length;

  // primaryActive — which bottom-nav tab to highlight
  const primaryActive =
    moreSheetOpen ? 'more'
    : PRIMARY_TABS.includes(mobileTab) ? mobileTab
    : 'more';

  function handlePrimary(id) {
    setMoreSheetOpen(false);
    setOpenClientObj(null);
    setMobileTab(id);
  }
  function handleMoreOpen() { setMoreSheetOpen(true); }
  function handleMorePick(id) {
    setMoreSheetOpen(false);
    if (id === 'block') { setShowBlock(true); return; }
    if (id === 'admin') { setGate('Admin panel'); return; }
    setOpenClientObj(null);
    setMobileTab(id);
  }

  // SoftGate full viewport
  if (gate) return <SoftGate feature={gate} onBack={() => setGate(null)} />;

  // Client profile overlay (read-only)
  if (openClientObj && window.ClientProfile) {
    return (
      <div style={{ minHeight: '100vh', background: 'var(--sand-50)' }}>
        <MobileTopBar coach={coach} onLogout={onLogout} onLogoTap={() => { setOpenClientObj(null); setMobileTab('home'); }} />
        <div style={{ padding: '12px 16px 96px' }}>
          <button onClick={() => setOpenClientObj(null)} style={{
            background: 'transparent', border: 'none', color: 'var(--walnut-700)',
            fontFamily: 'var(--f-body)', fontSize: 14, cursor: 'pointer',
            padding: '8px 0 14px', display: 'inline-flex', alignItems: 'center', gap: 6,
          }}>← Clients</button>
          <div className="mono" style={{
            background: 'var(--sand-200)', color: 'var(--walnut-700)',
            padding: '8px 12px', borderRadius: 'var(--r-md)',
            fontSize: 9, letterSpacing: 1.4, marginBottom: 14,
            border: '1px solid var(--hairline)',
          }}>📱 READ-FRIENDLY VIEW · OPEN ON TABLET/DESKTOP TO EDIT OVERRIDES</div>
          <window.ClientProfile client={openClientObj} onBack={() => setOpenClientObj(null)} readOnly={true} compact={true} />
        </div>
        <MobileBottomNav tab={mobileTab} primaryActive={'clients' === mobileTab ? 'more' : primaryActive}
          onPrimaryTap={handlePrimary} onMoreTap={handleMoreOpen} pendingCount={pendingCount} />
      </div>
    );
  }

  // Pick body
  let body = null;
  if (mobileTab === 'home') {
    body = (
      <MobileHomeTab coach={coach} events={events} clients={clients}
        openClient={(c) => setOpenClientObj(c)}
        onJumpToCalendar={() => setMobileTab('calendar')} />
    );
  } else if (mobileTab === 'calendar') {
    body = (
      <MobileCalendarPage coach={coach} events={events}
        onEventTap={(ev, di) => setSelectedEvent({ ev, dayIdx: di })}
        onNewBlock={() => setShowBlock(true)} />
    );
  } else if (mobileTab === 'invites') {
    body = <MobileInvitesTab invites={invites} setInvites={setInvites} toast={toast} />;
  } else if (mobileTab === 'clients') {
    body = (
      <MobileSubpage title="My Clients" onBack={() => setMobileTab('home')}>
        <MobileClientsTab coach={coach} clients={clients}
          openClient={(c) => setOpenClientObj(c)} />
      </MobileSubpage>
    );
  } else if (mobileTab === 'profile') {
    body = (
      <MobileSubpage title="My Profile" onBack={() => setMobileTab('home')} dense>
        <MobilePlaceholder
          label="Profile editor"
          msg="The full editor is rich on desktop. Lite mobile edit lands in v2.1."
        />
      </MobileSubpage>
    );
  } else if (mobileTab === 'integrations') {
    body = (
      <MobileSubpage title="Integrations" onBack={() => setMobileTab('home')} dense>
        <MobilePlaceholder
          label="Google Calendar sync"
          msg="Tap below to send the connection link to your email and finish on desktop."
          cta="Email myself this link →"
        />
      </MobileSubpage>
    );
  } else if (mobileTab === 'peers') {
    body = (
      <MobileSubpage title="Peer Calendars" onBack={() => setMobileTab('home')} dense>
        <MobilePlaceholder
          label="Read-only peer view"
          msg="Peer calendars are best on a wider screen. Tablet shows everyone side-by-side."
        />
      </MobileSubpage>
    );
  }

  return (
    <div style={{ minHeight: '100vh', background: 'var(--sand-50)' }}>
      <MobileTopBar coach={coach} onLogout={onLogout} onLogoTap={() => setMobileTab('home')} />
      {body}
      <MobileBottomNav
        tab={mobileTab} primaryActive={primaryActive}
        onPrimaryTap={handlePrimary} onMoreTap={handleMoreOpen}
        pendingCount={pendingCount}
      />
      {moreSheetOpen && (
        <MobileMoreSheet
          coach={coach} isAdmin={!!adminData}
          onClose={() => setMoreSheetOpen(false)}
          onPick={handleMorePick}
          onLogout={onLogout}
          onSwitchCoach={onLogout}
        />
      )}
      {showBlock && window.BlockTimeModal && (
        <window.BlockTimeModal onClose={() => setShowBlock(false)} onSave={(blk) => {
          if (setEvents) {
            setEvents(prev => ({ ...prev, [blk.dayIdx]: [...(prev[blk.dayIdx] || []), blk.ev] }));
          }
          setShowBlock(false);
          toast("Time blocked — members won't see this slot");
        }} />
      )}
      {selectedEvent && window.EventDrawer && (
        <window.EventDrawer selected={selectedEvent} onClose={() => setSelectedEvent(null)} onDelete={() => setSelectedEvent(null)} />
      )}
      <OrientationHint />
    </div>
  );
}

}

    overall:       parseFloat((rs.map(r=>r.overall).reduce((a,b)=>a+b,0)/rs.length).toFixed(1)),

// ------- Week / date helpers -------
function startOfWeek(d) {
  const x = new Date(d);
  const day = (x.getDay() + 6) % 7; // Mon = 0
  x.setDate(x.getDate() - day);
  x.setHours(0,0,0,0);
  return x;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmtMonth(d) { return d.toLocaleDateString("en-US", { month: "long", year: "numeric" }); }
function fmtDayLong(d) { return d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" }); }
function fmtTime(mins) {
  const h = Math.floor(mins/60), m = mins%60;
  const ampm = h < 12 ? "am" : "pm";
  const hh = ((h + 11) % 12) + 1;
  return `${hh}${m ? ":" + String(m).padStart(2,"0") : ""}${ampm}`;
}

// ------- CalendarHeader: view switch + nav + today -------
function CalendarHeader({ view, setView, cursor, setCursor, onNewBlock }) {
  const label = view === "month" ? fmtMonth(cursor)

    : fmtDayLong(cursor);

  function shift(n) {
    const x = new Date(cursor);
    if (view === "day") x.setDate(x.getDate() + n);
    else if (view === "week") x.setDate(x.getDate() + n*7);
    else x.setMonth(x.getMonth() + n);

// ------- Week view -------
const HOUR_HEIGHT = 56; // px per hour
const START_HOUR = 5;
const END_HOUR = 22;

function eventStyle(ev, col = 0, cols = 1) {
  const startMin = Math.max(ev.start, START_HOUR*60);
  const endMin = Math.min(ev.end, END_HOUR*60);
  const top = ((startMin - START_HOUR*60) / 60) * HOUR_HEIGHT;
  const h = Math.max(18, ((endMin - startMin) / 60) * HOUR_HEIGHT - 2);
  const width = `calc((100% - 8px) / ${cols} - 4px)`;
  const left = `calc(${col} * ((100% - 8px) / ${cols}) + 4px)`;
  return { top, height: h, width, left, position: "absolute" };
}

// Resolve overlaps into columns (simple greedy)
function layoutDay(events) {
  const sorted = [...events].sort((a,b) => a.start - b.start);
  const cols = []; // each col is array of events
  sorted.forEach(ev => {
    let placed = false;
    for (let i=0;i<cols.length;i++) {
      const last = cols[i][cols[i].length-1];
      if (last.end <= ev.start) { cols[i].push(ev); ev._col = i; placed = true; break; }
    }
    if (!placed) { cols.push([ev]); ev._col = cols.length - 1; }
  });
  const totalCols = Math.max(1, cols.length);
  sorted.forEach(ev => { ev._totalCols = totalCols; });
  return sorted;
}

function WeekView({ cursor, events, onEventClick }) {
  const weekStart = startOfWeek(cursor);
  const days = [0,1,2,3,4,5,6].map(i => addDays(weekStart, i));
  const hours = [];
  for (let h = START_HOUR; h < END_HOUR; h++) hours.push(h);
  const todayIso = new Date(2026, 3, 20).toDateString();

  return (
    <div style={{
      background: "var(--paper)", borderRadius: "var(--r-xl)",

    }}>

      <div style={{ display: "grid", gridTemplateColumns: "60px repeat(7, 1fr)", borderBottom: "1px solid var(--hairline)" }}>
        <div />
        {days.map((d,i) => {
          const isToday = d.toDateString() === todayIso;
          return (
            <div key={i} style={{ padding: "14px 10px", textAlign: "center", borderLeft: "1px solid var(--hairline)" }}>
              <div className="mono" style={{ color: "var(--clay-600)", fontSize: 10, marginBottom: 4 }}>
                {d.toLocaleDateString("en-US",{weekday:"short"})}
              </div>
              <div style={{
                width: 34, height: 34, margin: "0 auto",
                borderRadius: "50%",
                background: isToday ? "var(--walnut-700)" : "transparent",
                color: isToday ? "var(--paper)" : "var(--espresso-900)",
                display: "flex", alignItems: "center", justifyContent: "center",
                fontFamily: "var(--f-display)", fontSize: 20,
              }}>{d.getDate()}</div>
            </div>
          );
        })}
      </div>
      {/* Scroll body */}
      <div className="cal-scroll" style={{ maxHeight: "calc(100vh - 280px)" }}>
        <div style={{ display: "grid", gridTemplateColumns: "60px repeat(7, 1fr)", position: "relative" }}>
          {/* Hour column */}
          <div>
            {hours.map(h => (
              <div key={h} style={{ height: HOUR_HEIGHT, padding: "4px 8px 0 0", textAlign: "right" }} className="hour-label">
                {fmtTime(h*60)}
              </div>
            ))}
          </div>
          {/* Day columns */}
          {days.map((d, di) => {
            const dayEvents = events[di] || [];
            const laidOut = layoutDay(dayEvents);
            return (
              <div key={di} style={{ borderLeft: "1px solid var(--hairline)", position: "relative" }}>
                {hours.map(h => (
                  <div key={h} className="hour-line" style={{ height: HOUR_HEIGHT }} />
                ))}
                {laidOut.map(ev => (
                  <div key={ev.id} className={`evt ${ev.kind}`} onClick={() => onEventClick(ev, di)} style={eventStyle(ev, ev._col, ev._totalCols)}>

                      {fmtTime(ev.start)}
                    </div>

                  </div>
                ))}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

  function eventsForDate(d) {
    // Only show for the current demo week
    const diff = Math.floor((d - weekStart) / (24*3600*1000));
    if (diff >= 0 && diff < 7) return events[diff] || [];
    return [];
  }

  const todayStr = new Date(2026, 3, 20).toDateString();

  return (

              borderLeft: i % 7 === 0 ? "none" : "1px solid var(--hairline)",
              borderTop: i >= 7 ? "1px solid var(--hairline)" : "none",

}

function ProfilePage({ coach, profile, setProfile, toast }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(profile);

  useEffect(() => { setDraft(profile); }, [profile]);

  function save() {
    setProfile(draft);
    setEditing(false);
    toast("Profile updated — changes are live on the studio site");
  }

  const gallery = draft.gallery;

  function addMedia(kind) {
    const url = prompt(kind === "photo" ? "Paste image URL (or leave blank for placeholder)" : "Paste video URL (YouTube / Vimeo)");
    if (url === null) return;
    setDraft({ ...draft, gallery: [...gallery, { kind, url: url || "", caption: "" }] });
  }
  function removeMedia(i) {
    setDraft({ ...draft, gallery: gallery.filter((_, j) => j !== i) });
  }

// ------- Coach Rating Summary (private — bottom of coach's own profile) -------
function CoachRatingSummary({ coach }) {
  const avgs = coachAverages(coach.id);
  const past = ratingsForCoach(coach.id)
    .sort((a, b) => b.sessionDate.localeCompare(a.sessionDate));

  if (!avgs) return (
    <div style={{
      padding: '16px 20px', background: 'var(--sand-50)',
      border: '1px solid var(--hairline)', borderRadius: 10,
      fontFamily: 'var(--f-body)', fontSize: 13,
      color: 'var(--clay-600)',
    }}>
      No ratings yet. Ratings appear after clients complete their
      first session feedback.
    </div>
  );

  const tiles = [
    { label: 'Overall', value: `${avgs.overall}/5`, sub: `${avgs.count} sessions` },
    { label: 'Form',          value: `${avgs.form}/5`,          sub: 'coaching quality' },
    { label: 'Communication', value: `${avgs.communication}/5`, sub: 'clarity & support' },
    { label: 'Structure',     value: `${avgs.structure}/5`,     sub: 'session flow' },
  ];

  return (
    <div>
      <div style={{
        display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)',
        gap: 12, marginBottom: 20,
      }}>
        {tiles.map(t => (
          <div key={t.label} style={{
            padding: 14, borderRadius: 10,
            background: 'var(--sand-50)',
            border: '1px solid var(--hairline)',
          }}>
            <div style={{
              fontFamily: 'var(--f-mono)', fontSize: 10,
              letterSpacing: 1.4, textTransform: 'uppercase',
              color: 'var(--clay-600)',
            }}>{t.label}</div>
            <div style={{
              fontFamily: 'var(--f-display)', fontStyle: 'italic',
              fontSize: 26, color: 'var(--espresso-900)',
              marginTop: 4, lineHeight: 1,
            }}>{t.value}</div>
            <div style={{
              marginTop: 6, fontFamily: 'var(--f-body)', fontSize: 11.5,
              color: 'var(--clay-600)', lineHeight: 1.4,
            }}>{t.sub}</div>
          </div>
        ))}
      </div>

      <div style={{
        fontFamily: 'var(--f-mono)', fontSize: 10, letterSpacing: 1.4,
        textTransform: 'uppercase', color: 'var(--clay-600)',
        marginBottom: 10,
      }}>Recent feedback</div>
      {past.slice(0, 5).map((r, i) => (
        <div key={r.id} style={{
          padding: '12px 0',
          borderTop: i === 0 ? 'none' : '1px solid var(--hairline)',
        }}>
          <div style={{
            display: 'flex', justifyContent: 'space-between',
            alignItems: 'flex-start',
          }}>
            <div style={{ flex: 1 }}>
              <div style={{
                fontFamily: 'var(--f-mono)', fontSize: 9.5,
                letterSpacing: 1.2, textTransform: 'uppercase',
                color: 'var(--clay-600)',
              }}>
                {r.sessionDate} · {r.clientName}
              </div>
              {r.comment && (
                <div style={{
                  fontFamily: 'var(--f-body)', fontSize: 13,
                  color: 'var(--espresso-800)', marginTop: 4,
                  fontStyle: 'italic', lineHeight: 1.4,
                }}>"{r.comment}"</div>
              )}
            </div>
            <div style={{
              fontFamily: 'var(--f-display)', fontStyle: 'italic',
              fontSize: 20, color: 'var(--espresso-900)',
              marginLeft: 16, flexShrink: 0,
            }}>{r.overall}<span style={{
              fontFamily: 'var(--f-mono)', fontSize: 9,
              color: 'var(--clay-600)',
            }}>/5</span></div>
          </div>
        </div>
      ))}

      <div style={{
        marginTop: 14, fontFamily: 'var(--f-body)', fontSize: 12,
        color: 'var(--clay-600)',
      }}>
        Ratings are private — visible only to you and studio admins.
      </div>
    </div>
  );
}

    <div style={{

              background: active ? "var(--walnut-700)" : "var(--paper)",
              color: active ? "var(--paper)" : "var(--walnut-700)",
              cursor: "pointer", fontFamily: "var(--f-mono)",
              fontSize: 11, letterSpacing: 1.5, textTransform: "uppercase",
            }}>{f.label}</button>
          );
        })}
      </div>

      {/* Card grid */}
      <div className="clients-grid" style={{
        display: "grid", gridTemplateColumns: "repeat(2, minmax(0, 1fr))", gap: 16,
      }}>
        {filtered.map(c => {
          const pct = Math.round((c.done / c.total) * 100);
          const meta = statusMeta[c.status];
          return (
            <div key={c.id} style={{
              background: "var(--paper)", borderRadius: "var(--r-lg)",
              border: "1px solid var(--hairline-strong)", boxShadow: "var(--sh-2)",
              padding: 20, display: "flex", flexDirection: "column", gap: 14,
            }}>
              {/* Row 1: avatar + name + programme tag */}
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <CoachAvatar coach={{ initials: c.initials, tone: c.tone }} size={44} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontFamily: "var(--f-body)", fontWeight: 600, fontSize: 16, color: "var(--espresso-900)", lineHeight: 1.2 }}>
                    {c.name}
                  </div>
                </div>
                <span className="mono" style={{
                  background: "var(--sand-100)", color: "var(--walnut-700)",
                  padding: "4px 10px", borderRadius: "var(--r-pill)",
                  fontSize: 10, letterSpacing: 1.5, textTransform: "uppercase",
                  border: "1px solid var(--hairline)", whiteSpace: "nowrap",
                }}>{c.programme}</span>
              </div>

              {/* Row 2: stats */}
              <div className="mono" style={{ color: "var(--clay-600)", fontSize: 11, letterSpacing: 1.5, textTransform: "uppercase" }}>
                Session {c.done} of {c.total} · Since {c.since.toUpperCase()}
              </div>

              {/* Row 3: progress bar */}
              <div style={{ width: "100%", height: 6, background: "var(--sand-200)", borderRadius: "var(--r-pill)", overflow: "hidden" }}>
                <div style={{
                  width: pct + "%", height: "100%",
                  background: "var(--ochre-500)", borderRadius: "var(--r-pill)",
                  transition: "width .3s",
                }} />
              </div>

              {/* Row 4: chips */}
              <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                <span className="mono" style={{
                  fontSize: 10, letterSpacing: 1.5, textTransform: "uppercase",
                  color: "var(--clay-600)", padding: "4px 8px",
                  border: "1px solid var(--hairline)", borderRadius: "var(--r-pill)",
                }}>Last session: {c.lastSession}</span>
                <span className="mono" style={{
                  display: "inline-flex", alignItems: "center", gap: 6,
                  background: meta.bg, color: meta.fg,
                  padding: "4px 10px", borderRadius: "var(--r-pill)",
                  fontSize: 10, letterSpacing: 1.5, textTransform: "uppercase", fontWeight: 600,
                }}>
                  <span style={{ width: 6, height: 6, borderRadius: "50%", background: meta.dot }} />
                  {meta.label}
                </span>
              </div>

              {/* Footer actions */}
              <div style={{ display: "flex", gap: 8, marginTop: 4, paddingTop: 12, borderTop: "1px solid var(--hairline)" }}>
                <button onClick={() => setOpenClient(c)} style={{
                  flex: 1, padding: "8px 14px", borderRadius: "var(--r-pill)",
                  background: "var(--walnut-700)", color: "var(--paper)", border: "none",
                  cursor: "pointer", fontSize: 12, fontFamily: "var(--f-body)", fontWeight: 500,
                }}>View profile</button>
                <button onClick={() => toast(`Logging session for ${c.name}`)} style={{
                  flex: 1, padding: "8px 14px", borderRadius: "var(--r-pill)",
                  background: "var(--paper)", color: "var(--walnut-700)",
                  border: "1px solid var(--hairline-strong)",
                  cursor: "pointer", fontSize: 12, fontFamily: "var(--f-body)", fontWeight: 500,
                }}>Log session</button>
              </div>
            </div>
          );
        })}
      </div>

      {filtered.length === 0 && (
        <div style={{ padding: 48, borderRadius: "var(--r-lg)", background: "var(--paper)", border: "1px solid var(--hairline)", textAlign: "center", color: "var(--clay-600)" }}>
          No clients match this filter.
        </div>
      )}

      <style>{`
        @media (max-width: 900px) {
          .clients-grid { grid-template-columns: 1fr !important; }
        }
      `}</style>
    </div>
  );
}

// ------- App root -------
function App() {
  const [coach, setCoach] = useState(null);
  const [section, setSection] = useState("calendar");
  const [events, setEvents] = useState({});
  const [invites, setInvites] = useState(SEED_INVITES);
  const [clients, setClients] = useState(SEED_CLIENTS);
  const [profile, setProfile] = useState(null);
  const [toastMsg, setToastMsg] = useState("");
  const [gConnected, setGConnected] = useState(false);
  const [adminData, setAdminData] = useState(null);

  // Track pending for sidebar badge (writing to window so Sidebar can read)
  useEffect(() => {
    window.__pendingInvites = invites.filter(i => i.status === "pending").length;
  }, [invites]);

  // Track ending-soon clients for sidebar badge
  useEffect(() => {
    window.__endingSoon = clients.filter(c => c.status === "ending").length;
  }, [clients]);

  function toast(msg) {
    setToastMsg(msg);
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => setToastMsg(""), 3000);
  }

  function login(selectedCoach) {
    setCoach(selectedCoach);
    setEvents(buildEventsForCoach(selectedCoach.id));
    const rec = (window.getAdminRecord && window.getAdminRecord(selectedCoach)) || null;
    setAdminData(rec);
    if (rec) setSection("admin");
    setProfile({
      photo: "", // empty → initials avatar
      bio: selectedCoach.bio,
      instagram: "@" + selectedCoach.id + ".m3s",
      gallery: [
        { kind: "photo", url: "" },
        { kind: "photo", url: "" },
        { kind: "video", url: "" },
      ],
    });
  }

  function logout() {
    setCoach(null);
    setSection("calendar");
    setAdminData(null);
  }

  // Detect device tier — honour ?mobile=1 override for prototyping
  const forceMobile = new URLSearchParams(window.location.search).get('mobile') === '1';
  const isMobile  = forceMobile || (window.useMediaQuery ? window.useMediaQuery(window.BP.mobile)  : false);
  const isTablet  = !forceMobile && (window.useMediaQuery ? window.useMediaQuery(window.BP.tablet)  : false);

  if (!coach) return <Login onLogin={login} forceMobile={forceMobile} />;

  // Tier 1+2 — full mobile experience for floor-use screens
  if (isMobile && window.MobileShell) {
    return (
      <>
        <window.MobileShell
          coach={coach} clients={clients}
          invites={invites} setInvites={setInvites}
          events={events} setEvents={setEvents} adminData={adminData}
          toast={toast} onLogout={logout}
        />
        {toastMsg && <div className="toast"><span style={{ width: 6, height: 6, borderRadius: "50%", background: "var(--ochre-500)" }} />{toastMsg}</div>}
      </>
    );
  }

  // Desktop + tablet — existing layout (tablet collapses sidebar to icon mode)
  return (
    <>
      <div style={{ display: "flex", minHeight: "100vh", background: "var(--sand-50)" }}>
        <Sidebar coach={coach} section={section} onSection={setSection} onLogout={logout} isAdmin={!!adminData} adminData={adminData} collapsed={isTablet} />

        <main style={{ flex: 1, padding: "36px 40px", overflow: "hidden" }}>
          {/* Top bar */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 32, gap: 16, flexWrap:"wrap" }}>
            <div className="mono" style={{ color: "var(--clay-600)" }}>
              — {new Date(2026, 3, 20).toLocaleDateString("en-US", { weekday: "long", month:"long", day:"numeric", year:"numeric" })}
            </div>
            <div style={{ display: "flex", alignItems:"center", gap: 12 }}>
              <button onClick={() => window.location.href = '?mobile=1'} title="Preview mobile layout" style={{
                display: "inline-flex", alignItems: "center", gap: 7,
                padding: "8px 14px", borderRadius: "var(--r-pill)",
                border: "1px solid var(--hairline-strong)", background: "var(--paper)",
                color: "var(--clay-600)", fontFamily: "var(--f-body)", fontSize: 13,
                cursor: "pointer",
              }}>📱 Mobile view</button>
              {gConnected && (
                <span className="chip" style={{ background:"#DEE5D3", color:"#3E4A32", borderColor:"#B8C4A5" }}>
                  <span className="chip-dot" style={{ background:"#7B8B6F" }} />
                  Google synced
                </span>
              )}
              <span className="chip">{invites.filter(i => i.status === "pending").length} pending invites</span>
            </div>
          </div>

          {section === "calendar" && <CalendarPage coach={coach} events={events} setEvents={setEvents} invites={invites} setInvites={setInvites} toast={toast} />}
          {section === "invites"  && <SchedulePage coach={coach} toast={toast} />}
          {section === "clients"  && <ClientsPage coach={coach} clients={clients} toast={toast} />}
          {section === "peers"    && <PeersPage coach={coach} />}
          {section === "profile"  && profile && <ProfilePage coach={coach} profile={profile} setProfile={setProfile} toast={toast} />}
          {section === "sync"     && <SyncPage connected={gConnected} setConnected={setGConnected} toast={toast} />}
          {section === "admin" && adminData && window.AdminPage && <window.AdminPage coach={coach} adminData={adminData} invites={invites} setInvites={setInvites} toast={toast} />}
        </main>
      </div>

      {toastMsg && <div className="toast"><span style={{ width: 6, height: 6, borderRadius: "50%", background: "var(--ochre-500)" }} />{toastMsg}</div>}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

Object.assign(window, { Login, Sidebar, CoachAvatar, SEED_INVITES, buildEventsForCoach, hm, App, EventDrawer, BlockTimeModal });

</script>

</body>
</html>
